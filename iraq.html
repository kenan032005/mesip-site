<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊拉克专题 · 中东地区社会安全信息平台</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="container">
  <p><a href="index.html">← 返回首页</a></p>
  <div class="hero">
    <h1>伊拉克安全专题</h1>
    <p>伊拉克为本平台第一重点国家，重点关注巴格达、巴士拉、南部油气产区、机场港口道路、边境口岸与油田周边安全动态。</p>
  </div>

  <div class="section">
    <h2>伊拉克当前风险等级</h2>
    <div id="riskBox"></div>
  </div>
  <div class="section">
    <h2>过去24小时安全动态</h2>
    <div class="grid cards" id="iq24"></div>
  </div>
  <div class="section">
    <h2>巴格达</h2>
    <div class="grid cards" id="baghdad"></div>
  </div>
  <div class="section">
    <h2>巴士拉</h2>
    <div class="grid cards" id="basra"></div>
  </div>
  <div class="section">
    <h2>油气产区与能源设施</h2>
    <div class="grid cards" id="energy"></div>
  </div>
  <div class="section">
    <h2>过去72小时持续跟踪</h2>
    <div class="grid cards" id="iq72"></div>
  </div>
</div>
<footer class="site"></footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/data.js"></script>
<script>
window.__STATIC__ = true;
(function () {
  function all() { return window.__DB__.events || []; }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (path === "/api/overview") return window.__DB__.overview;
    if (path === "/api/iraq") return window.__DB__.iraq;
    if (path === "/api/reports") return { reports: window.__DB__.reports };
    if (path === "/api/countries") return { countries: ((window.__DB__.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); return window.__DB__.eventMap[id] || { event: null, related: [] }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return window.__DB__.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return window.__DB__.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  API.get = function (path) { return Promise.resolve(match(path)); };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };
})();
</script>
<script>
renderHeader("iraq.html");
API.get("/api/iraq").then(d => {
  if (d.country) $("#riskBox").innerHTML = `<div class="panel" style="display:inline-block;">${esc(d.country.name_zh)} 当前风险：${riskBadge(d.country.current_risk)}</div>`;
  const fill = (id, arr) => $("#" + id).innerHTML = (arr && arr.length)
    ? arr.map(e => eventCard(e)).join("")
    : `<div class="empty">暂无相关动态。</div>`;
  fill("iq24", d.iraq_24h);
  fill("baghdad", d.baghdad);
  fill("basra", d.basra);
  fill("energy", d.energy);
  fill("iq72", d.iraq_72h);
}).catch(e => { $("#riskBox").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });
</script>
</body>
</html>
