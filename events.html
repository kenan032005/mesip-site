<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  // 构建元数据（控制台/调试用）：build_timestamp / git_commit / public_report_count / schema_version
  try {
    var _bm = (DB && DB.build_meta) || null;
    if (_bm) {
      window.__MESIP_BUILD__ = _bm;
      console.info("[MESIP 静态构建] " + (_bm.build_timestamp || "") + " | commit=" + (_bm.git_commit || "") +
        " | 专业报告(published)=" + (_bm.public_report_count) + " | schema=" + (_bm.schema_version || ""));
    }
  } catch (e) {}

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    // 详情优先从 proDetail（含全文翻译字段）查询，回退到列表精简版
    var arr = (DB && DB.proDetail) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    arr = (DB && DB.proReports) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String(arr[j].id) === String(id)) return arr[j];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  // ---- F11：历史事件分片按需回源 ----
  // data.js 只含最新 2000 条公开事件；更早的历史事件详情从
  // assets/js/event_shards/s_<id 起点>.json 按需拉取（GitHub Pages 纯静态可用）。
  var _shardCache = {};
  function shardFile(id) {
    var n = parseInt(id, 10);
    if (!n || n < 0 || isNaN(n)) return null;
    var start = Math.floor(n / 1000) * 1000;
    return "assets/js/event_shards/s_" + ("00000" + start).slice(-5) + ".json";
  }
  function loadShard(id) {
    var f = shardFile(id);
    if (!f) return Promise.resolve(null);
    if (_shardCache[f]) return _shardCache[f];
    _shardCache[f] = fetch(f, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("分片 " + f + " 加载失败（HTTP " + r.status + "）");
      return r.json();
    }).then(function (j) {
      return (j && j.events) ? j.events : [];
    }).catch(function (e) {
      _shardCache[f] = null;   // 允许重试，不把失败永久缓存
      throw e;
    });
    return _shardCache[f];
  }
  function shardEvent(id) {
    return loadShard(id).then(function (evs) {
      for (var i = 0; i < evs.length; i++) {
        if (String(evs[i].id) === String(id)) return evs[i];
      }
      return null;
    });
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    // F10 修复（2026-10-23）：分类下拉的 value 是规范代码（如 armed_conflict），
    // 而事件字段 category 是中文名（如 武装冲突与军事行动）。旧代码只比中文名，
    // 导致选择任一类别都返回 0 条。现在同时接受代码与中文名。
    var cat = p.get("category");
    if (cat) arr = arr.filter(function (e) { return e.category_code === cat || e.category === cat; });
    // F10 修复：风险下限（"高风险及以上"），与首页卡片口径一致
    var rm = p.get("risk_min"); if (rm) arr = arr.filter(function (e) { return (e.risk_level || 0) >= parseInt(rm); });
    // F10 修复：伊拉克 / WQ1 直接影响，与首页卡片同口径（标签或国家匹配）
    if (p.get("iraq") === "1") arr = arr.filter(function (e) {
      return (e.module_tags || []).indexOf("iraq") >= 0 || e.country === "伊拉克";
    });
    if (p.get("wq1") === "1") arr = arr.filter(function (e) {
      return (e.module_tags || []).indexOf("wq1") >= 0;
    });
    // F10 修复：状态过滤，使卡片链接（status=published）落地集合与卡片计数口径一致
    var st = p.get("status"); if (st) arr = arr.filter(function (e) { return e.status === st; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category, e.category_code].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/home") return DB.home;
    if (path === "/api/hormuz") return { report: DB.hormuz };
    if (path === "/api/brent") return DB.brent;
    if (path.indexOf("/api/reuters") === 0) return DB.reuters || { items: [], count: 0 };
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) {
      var id = path.split("/").pop();
      // 全文接口在静态版由页面自行处理（给出明确提示 + 原文链接）
      if (path.indexOf("/fulltext") >= 0) { return { status: "static", note: "静态归档版不提供按需全文翻译" }; }
      var e = byId(id);
      if (e) return { event: e, related: relatedOf(e) };
      // 主数据未收录（多为 2000 条上限外的历史事件）→ 交给分片回源
      return { __shardEventId: id };
    }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      // 默认仅返回 published（与 server.py _pro_public_filters 一致），export=all 解除限制
      var xpt = p.get("export");
      if (xpt !== "all") { arr = arr.filter(function (x) { return x.status === "published"; }); }
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var dom = p.get("domain");
      if (dom) arr = arr.filter(function (x) { return (x.content_categories || "").indexOf(dom) >= 0; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var rg = p.get("region");
      if (rg) arr = arr.filter(function (x) { return (x.regions || x.countries || "").indexOf(rg) >= 0; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      // 分页（与 server.py api_pro_reports 一致）
      var total = arr.length;
      var pg = parseInt(p.get("page") || "1", 10); if (!pg || pg < 1) pg = 1;
      var psz = parseInt(p.get("page_size") || "0", 10); if (!psz || psz < 0) psz = 0;
      if (psz > 100) psz = 100;
      var out = arr;
      if (psz > 0) out = arr.slice((pg - 1) * psz, pg * psz);
      return { reports: out, count: out.length, total: total, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-institutions") === 0) {
      return DB.proInstitutions || { institutions: [], count: 0 };
    }
    if (path.indexOf("/api/decision-brief") === 0) {
      // Stage 4（2026-08-05）：决策型日报静态路由
      var q = new URLSearchParams(path.split("?")[1] || "");
      var ddate = q.get("date") || "";
      var arr = DB.decisionBriefs || [];
      if (ddate) {
        var hit = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i].brief_date === ddate) { hit = arr[i]; break; } }
        return { brief: hit };
      }
      return { brief: arr.length ? arr[0] : null };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) { reject(new Error("静态数据缺失：" + (r.error || path))); return; }
        // F11：主数据（data.js，最新 2000 条）里没有的事件 → 按需拉历史分片
        if (r && r.__shardEventId !== undefined) {
          shardEvent(r.__shardEventId).then(function (ev) {
            if (!ev) {
              // 分片里也没有：说明该记录不满足公开条件（已隔离/未获发布资格/涉版权或安全限制）
              resolve({ event: null, related: [], notPublic: true });
              return;
            }
            resolve({ event: ev, related: relatedOf(ev) });
          }).catch(function (err) { reject(err); });
          return;
        }
        resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("events.html");

// ====== F10 修复（2026-10-23）=====
// 1) URL 参数初始化控件：进入带参链接时先填充控件，保证「指标卡跳转 → 落地集合」一致，
//    并支持浏览器返回。
// 2) from/to 不再无条件拼 " 00:00:00"/" 23:59:59"：首页传入的是完整时间戳，
//    拼接后会产生 "2026-10-22 14:21:49 00:00:00" 这类非法值导致字符串比较失效。
// 3) 分类过滤同时接受规范代码与中文名（下拉 value 是 code，数据字段 category 是中文名）。
function _normDateTime(v) {
  if (!v) return "";
  // 已是完整时间（含时分秒）则原样使用；仅日期则补 00:00:00
  return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(v) ? v : (v + " 00:00:00");
}
// URL 参数在脚本执行早期捕获（location.search 不会变），供 buildQuery 兜底使用
const _URL_PARAMS = new URLSearchParams(location.search);
// 时间参数的精确值必须单独留存：日期输入控件（type=date）只保留到"日"，
// 若直接用表单值会把卡片链接的 "YYYY-MM-DD HH:MM:SS" 退化成 "… 00:00:00"，
// 导致 24 小时窗口被放大成整天（2026-10-23 实测）。
const _URL_EXACT = {
  from: _URL_PARAMS.get("from") || "",
  to: _URL_PARAMS.get("to") || ""
};
// 用户是否手动改过筛选控件：未改过 → URL 参数为准；改过 → 表单为准
let _userEdited = false;

// 把 URL 参数回填到筛选控件。
// 必须在下拉 option 填充完成之后调用：否则给 select 赋一个尚不存在的 value 会静默失败，
// 导致"看起来初始化了、实际过滤条件为空"（2026-10-23 实测踩坑）。
function _initFromURL() {
  const p = new URLSearchParams(location.search);
  const map = { country: "#f-country", risk: "#f-risk", category: "#f-cat", q: "#f-q" };
  Object.keys(map).forEach(k => {
    const v = p.get(k);
    if (v !== null && $(map[k])) $(map[k]).value = v;
  });
  const f = p.get("from"), t = p.get("to");
  if (f && $("#f-from")) $("#f-from").value = f.slice(0, 10);
  if (t && $("#f-to")) $("#f-to").value = t.slice(0, 10);
  if (p.get("china") === "1" && $("#f-china")) $("#f-china").checked = true;
  const rm = p.get("risk_min");
  if (rm && $("#f-riskmin")) $("#f-riskmin").value = rm;
  return p;
}

function buildQuery() {
  // 用户未操作过控件时，URL 参数作为兜底；否则只看表单，避免清空条件后被旧 URL 参数粘回
  const up = _userEdited ? new URLSearchParams() : _URL_PARAMS;
  const p = new URLSearchParams();
  const c = $("#f-country").value, r = $("#f-risk").value, cat = $("#f-cat").value;
  const f = $("#f-from").value, t = $("#f-to").value, q = $("#f-q").value;
  const rm = $("#f-riskmin") ? $("#f-riskmin").value : "";
  // F10：表单为空时保留 URL 上的同名参数，绝不能 delete（否则卡片链接的筛选条件被抹掉）
  if (c) p.set("country", c); else if (up.get("country")) p.set("country", up.get("country"));
  if (r) p.set("risk", r); else if (up.get("risk")) p.set("risk", up.get("risk"));
  if (rm) p.set("risk_min", rm); else if (up.get("risk_min")) p.set("risk_min", up.get("risk_min"));
  if (cat) p.set("category", cat); else if (up.get("category")) p.set("category", up.get("category"));
  // 时间：优先用 URL 上的精确值，避免日期控件把时分秒截断掉
  if (_URL_EXACT.from) p.set("from", _URL_EXACT.from);
  else if (f) p.set("from", _normDateTime(f));
  if (_URL_EXACT.to) p.set("to", _URL_EXACT.to);
  else if (t) p.set("to", _normDateTime(t).replace("00:00:00", "23:59:59"));
  if ($("#f-china").checked) p.set("china", "1"); else if (up.get("china")) p.set("china", up.get("china"));
  if (q) p.set("q", q); else if (up.get("q")) p.set("q", up.get("q"));
  // 卡片专用口径（无对应控件）必须原样透传
  ["iraq", "wq1", "status"].forEach(k => { if (up.get(k)) p.set(k, up.get(k)); });
  return p.toString();
}

function load() {
  const q = buildQuery();
  API.get("/api/events?" + q).then(d => {
    $("#count").textContent = `共 ${d.count} 条事件`;
    $("#list").innerHTML = d.events.length
      ? d.events.map(e => eventCard(e)).join("")
      : `<div class="empty">没有符合条件的事件。</div>`;
  }).catch(e => { $("#list").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });
}

// 1) 先同步填充类别下拉（CATEGORY_LIST 是同步常量），确保后续 value 赋值有效
const catSel = $("#f-cat");
CATEGORY_LIST.forEach(x => { const o = document.createElement("option"); o.value = x.code; o.textContent = x.zh; catSel.appendChild(o); });

// 2) 用户一旦动了筛选控件，就切换到"表单为准"
["#f-country", "#f-risk", "#f-cat", "#f-from", "#f-to", "#f-q", "#f-china", "#f-riskmin"].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener("change", () => { _userEdited = true; });
  el.addEventListener("input", () => { _userEdited = true; });
});

$("#btnSearch").onclick = load;
$("#f-q").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("#btnReset").onclick = () => { location.href = "events.html"; };

// 3) 国家下拉异步填充 → 填充完成后再回填 URL 参数 → 再首次加载。
//    顺序不可颠倒：否则 option 不存在时赋值静默失败，过滤条件丢失。
API.get("/api/overview").then(d => {
  const sel = $("#f-country");
  (d.countries || []).forEach(c => {
    const o = document.createElement("option"); o.value = c.name_zh; o.textContent = c.name_zh; sel.appendChild(o);
  });
  _initFromURL();
  load();
}).catch(() => { _initFromURL(); load(); });

// 自动刷新：每 5 分钟重新拉取一次，确保显示最新新闻（后端每小时自动采集）
setInterval(() => { load(); }, 5 * 60 * 1000);
</script>
