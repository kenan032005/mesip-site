<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件详情 · 中东地区社会安全信息平台</title>
<link rel="stylesheet" href="assets/css/style.css?v=1784397243">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="container">
  <p><a href="events.html">← 返回事件列表</a></p>
  <div class="panel" id="detail"><p class="muted">加载中……</p></div>
  <div class="section">
    <h2>相关事件</h2>
    <div class="grid cards" id="related"></div>
  </div>
</div>
<footer class="site"></footer>

<script src="assets/js/api.js?v=1784397243"></script>
<script src="assets/js/common.js?v=1784397243"></script>
<script src="assets/data.js?v=1784397243"></script>
<script>
window.__STATIC__ = true;
(function () {
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未成功加载（data.js 缺失或解析失败），请刷新页面重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("event.html");
const id = getQS("id");
API.get("/api/event/" + id).then(d => {
  if (!d.event) { $("#detail").innerHTML = `<div class="empty">未找到该事件。</div>`; return; }
  const e = d.event;
  const row = (k, v) => v ? `<div class="kv"><b>${k}</b><span>${v}</span></div>` : "";
  let html = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <h2 style="margin:0;border:none;padding:0;">${esc(e.title_zh || e.title_original)}</h2>
      ${riskBadge(e.risk_level)}</div>`;
  if (e.title_original && e.title_original !== e.title_zh) html += `<p class="muted small">原文标题：${esc(e.title_original)}</p>`;
  if (e.source_url) html += `<div style="margin-top:10px;"><a class="src-link" href="${esc(e.source_url)}" target="_blank" rel="noopener">🔗 查看新闻原文</a></div>`;
  html += `<div class="meta" style="margin-top:14px;">
    ${row("国家", esc(e.country))}
    ${row("城市/地区", esc(e.city))}
    ${row("事件发生时间", esc(e.event_time))}
    ${row("信息发布时间", esc(e.publish_time))}
    ${row("事件类别", esc(e.category))}
    ${row("信息可信度", esc(e.credibility_name))}
    ${row("人员伤亡", esc(e.casualties))}
    ${row("对当地社会安全影响", esc(e.impact_social))}
    ${row("对外国人和企业影响", esc(e.impact_foreign))}
    ${row("对中国企业和公民影响", esc(e.impact_china))}
    ${row("对交通/机场/港口/道路影响", esc(e.impact_transport))}
    ${row("对能源设施和项目影响", esc(e.impact_energy))}
    ${row("后续可能发展", esc(e.trend))}
    ${row("信息来源", esc(e.source_name))}
    ${row("原文链接", e.source_url ? `<a href="${esc(e.source_url)}" target="_blank" rel="noopener">打开原始来源 ↗</a>` : (e.source_name ? esc(e.source_name) : ""))}
    ${row("最后更新", esc(e.updated_at))}
  </div>`;
  html += `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">事件摘要</h3><p>${esc(e.summary)}</p></div>`;
  if (e.detail && e.detail !== e.summary) html += `<div><h3 style="margin:0 0 6px;">详细情况</h3><p>${esc(e.detail)}</p></div>`;
  html += `<div style="margin-top:14px;padding:12px;background:#fff8e1;border-radius:8px;"><b>安全建议：</b>${esc(e.advice)}</div>`;
  if (e.updates && e.updates.length) {
    html += `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">更新记录</h3><ul class="small">` +
      e.updates.map(u => `<li>${esc(u.note)} <span class="muted">(${fmtTime(u.ts)})</span></li>`).join("") + `</ul></div>`;
  }
  html += `<div style="margin-top:10px;">${flagTags(e)}</div>`;
  $("#detail").innerHTML = html;
  $("#related").innerHTML = d.related.length ? d.related.map(x => eventCard(x)).join("")
    : `<div class="empty">暂无相关事件。</div>`;
}).catch(e => { $("#detail").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });
</script>
</body>
</html>
