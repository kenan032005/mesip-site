<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>事件详情 · 中东地区社会安全信息平台</title>

<body>
<div id="topbar" class="topbar"></div>
<div class="container">
  <p><a href="events.html">← 返回事件列表</a></p>
  <div class="panel" id="detail"><p class="muted">加载中……</p></div>
  <div class="section">
    <h2>相关事件</h2>
    <div class="grid cards" id="related"></div>
  </div>
</div>

<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  // 构建元数据（控制台/调试用）：build_timestamp / git_commit / public_report_count / schema_version
  try {
    var _bm = (DB && DB.build_meta) || null;
    if (_bm) {
      window.__MESIP_BUILD__ = _bm;
      console.info("[MESIP 静态构建] " + (_bm.build_timestamp || "") + " | commit=" + (_bm.git_commit || "") +
        " | 专业报告(published)=" + (_bm.public_report_count) + " | schema=" + (_bm.schema_version || ""));
    }
  } catch (e) {}

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    // 详情优先从 proDetail（含全文翻译字段）查询，回退到列表精简版
    var arr = (DB && DB.proDetail) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    arr = (DB && DB.proReports) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String(arr[j].id) === String(id)) return arr[j];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/home") return DB.home;
    if (path === "/api/hormuz") return { report: DB.hormuz };
    if (path === "/api/brent") return DB.brent;
    if (path.indexOf("/api/reuters") === 0) return DB.reuters || { items: [], count: 0 };
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      // 默认仅返回 published（与 server.py _pro_public_filters 一致），export=all 解除限制
      var xpt = p.get("export");
      if (xpt !== "all") { arr = arr.filter(function (x) { return x.status === "published"; }); }
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var dom = p.get("domain");
      if (dom) arr = arr.filter(function (x) { return (x.content_categories || "").indexOf(dom) >= 0; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var rg = p.get("region");
      if (rg) arr = arr.filter(function (x) { return (x.regions || x.countries || "").indexOf(rg) >= 0; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      // 分页（与 server.py api_pro_reports 一致）
      var total = arr.length;
      var pg = parseInt(p.get("page") || "1", 10); if (!pg || pg < 1) pg = 1;
      var psz = parseInt(p.get("page_size") || "0", 10); if (!psz || psz < 0) psz = 0;
      if (psz > 100) psz = 100;
      var out = arr;
      if (psz > 0) out = arr.slice((pg - 1) * psz, pg * psz);
      return { reports: out, count: out.length, total: total, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-institutions") === 0) {
      return DB.proInstitutions || { institutions: [], count: 0 };
    }
    if (path.indexOf("/api/decision-brief") === 0) {
      // Stage 4（2026-08-05）：决策型日报静态路由
      var q = new URLSearchParams(path.split("?")[1] || "");
      var ddate = q.get("date") || "";
      var arr = DB.decisionBriefs || [];
      if (ddate) {
        var hit = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i].brief_date === ddate) { hit = arr[i]; break; } }
        return { brief: hit };
      }
      return { brief: arr.length ? arr[0] : null };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("event.html");
const id = getQS("id");

function dimBar(label, val, max) {
  const v = Number(val) || 0;
  const pct = Math.max(0, Math.min(100, (v / max) * 100));
  return `<div class="dim"><span class="dim-l">${esc(label)}</span>` +
    `<span class="dim-bar"><i style="width:${pct}%"></i></span>` +
    `<span class="dim-v">${v}/${max}</span></div>`;
}

function riskRatingBlock(e) {
  const ct = e.content_type || "A";
  const isInfo = (ct === "D" || ct === "E" || ct === "F" || ct === "G");
  const srcCount = (e.updates && Array.isArray(e.updates) && e.updates.length)
    ? e.updates.length : (e.source_count || 1);
  if (isInfo) {
    return `<div class="rating-box info">
      <div class="rb-head">${contentTypeBadge(ct)} <b>${esc((CONTENT_TYPES[ct] || ["信息"])[0])}</b>
        ${statusBadge(e.event_status)}</div>
      <p class="muted small">该内容属于“${esc((CONTENT_TYPES[ct] || ["信息"])[0])}”，不赋予安全事件风险等级，不计入安全事件统计。</p>
      <div class="rb-row">${credBadge(e.credibility_grade)} ${wq1Badge(e.wq1_relevance)}
        <span class="tag">来源 ${srcCount} 条</span></div>
      ${e.risk_rationale ? `<div class="rb-reason">${esc(e.risk_rationale)}</div>` : ""}
    </div>`;
  }
  const risk = Number(e.risk_level) || 0;
  const score = (e.risk_score !== null && e.risk_score !== undefined && e.risk_score !== "") ? e.risk_score : "—";
  return `<div class="rating-box">
    <div class="rb-head">${contentTypeBadge(ct)} ${riskBadge(risk)}
      <b>评分 ${esc(score)}/100</b> ${statusBadge(e.event_status)}
      <a class="mlink" href="methodology.html#event" target="_blank" rel="noopener">评级方法 ↗</a></div>
    <div class="dims">
      ${dimBar("人员及财产后果", e.score_consequence, 30)}
      ${dimBar("事件范围和影响规模", e.score_scope, 15)}
      ${dimBar("持续性和升级可能", e.score_persistence, 20)}
      ${dimBar("交通、能源和运营中断", e.score_disruption, 20)}
      ${dimBar("行为主体意图和能力", e.score_actor, 15)}
    </div>
    <div class="rb-row">${credBadge(e.credibility_grade)} ${wq1Badge(e.wq1_relevance)}
      <span class="tag">来源 ${srcCount} 条</span></div>
    <div class="rb-reason"><b>评级理由：</b>${esc(e.risk_rationale || "—")}</div>
  </div>`;
}

function renderFulltext(e) {
  const box = document.getElementById("fulltext-box");
  if (!box) return;
  if (e.full_text_zh && e.full_text_zh.trim()) {
    box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文（中文翻译）</h3>` +
      `<div class="fulltext-body" style="white-space:pre-wrap;line-height:1.75;">${esc(e.full_text_zh).replace(/\n/g, "<br>")}</div>`;
    return;
  }
  // 静态归档版（GitHub Pages 等无后端）无法按需抓取并翻译原文，
  // 此处直接给出明确提示 + 原文链接，避免“正在获取/获取失败”的误导性空状态。
  if (window.__STATIC__) {
    const link = (e.source_url)
      ? `<a href="${esc(e.source_url)}" target="_blank" rel="noopener">查看新闻原文 ↗</a>`
      : (e.source_name ? esc(e.source_name) : "无原文链接");
    box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文</h3>` +
      `<p class="muted small">本静态归档版未收录该新闻的中文全文翻译。${link}</p>`;
    return;
  }
  const st = e.fulltext_status;
  if (st === "unavailable") {
    box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文</h3><p class="muted small">该新闻原文未提供可翻译的正文，暂不支持全文展示。</p>`;
    return;
  }
  box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文</h3><p class="muted small">正在获取并翻译原文全文……</p>`;
  API.get("/api/event/" + id + "/fulltext").then(r => {
    if (r.status === "done" && r.full_text_zh) {
      box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文（中文翻译）</h3>` +
        `<div class="fulltext-body" style="white-space:pre-wrap;line-height:1.75;">${esc(r.full_text_zh).replace(/\n/g, "<br>")}</div>`;
    } else {
      box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文</h3><p class="muted small">${esc(r.note || "暂无法获取该新闻的全文翻译。")}</p>`;
    }
  }).catch(err => {
    box.innerHTML = `<h3 style="margin:0 0 6px;">新闻全文</h3><p class="muted small">获取全文失败：${esc(err.message)}</p>`;
  });
}

API.get("/api/event/" + id).then(d => {
  if (!d.event) { $("#detail").innerHTML = `<div class="empty">未找到该事件。</div>`; return; }
  const e = d.event;
  const row = (k, v) => v ? `<div class="kv"><b>${k}</b><span>${v}</span></div>` : "";
  let html = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
      <h2 style="margin:0;border:none;padding:0;">${esc(e.title_zh || e.title_original)}</h2>
      ${riskBadge(e.risk_level)}</div>`;
  if (e.title_original && e.title_original !== e.title_zh) html += `<p class="muted small">原文标题：${esc(e.title_original)}</p>`;
  if (e.source_url) html += `<div style="margin-top:10px;"><a class="src-link" href="${esc(e.source_url)}" target="_blank" rel="noopener">🔗 查看新闻原文</a></div>`;
  html += `<div class="meta" style="margin-top:14px;">
    ${row("国家", esc(e.country))}
    ${row("城市/地区", esc(e.city))}
    ${row("事件发生时间", fmtTimeBJ(e.event_time))}
    ${row("信息发布时间", fmtTimeBJ(e.publish_time))}
    ${row("事件类别", esc(e.category))}
    ${row("信息可信度", esc(e.credibility_name))}
    ${row("人员伤亡", esc(e.casualties))}
    ${row("对当地社会安全影响", esc(e.impact_social))}
    ${row("对外国人和企业影响", esc(e.impact_foreign))}
    ${row("对中国企业和公民影响", esc(e.impact_china))}
    ${row("对交通/机场/港口/道路影响", esc(e.impact_transport))}
    ${row("对能源设施和项目影响", esc(e.impact_energy))}
    ${row("后续可能发展", esc(e.trend))}
    ${row("信息来源", esc(e.source_name))}
    ${row("原文链接", e.source_url ? `<a href="${esc(e.source_url)}" target="_blank" rel="noopener">打开原始来源 ↗</a>` : (e.source_name ? esc(e.source_name) : ""))}
    ${row("最后更新", esc(e.updated_at))}
  </div>`;
  html += riskRatingBlock(e);
  const summaryHtml = (e.summary && e.summary.trim())
    ? esc(e.summary)
    : `<span class="muted">暂无文字摘要，可查看下方「新闻全文」或${e.source_url ? `<a href="${esc(e.source_url)}" target="_blank" rel="noopener">原文链接 ↗</a>` : "原文"}。</span>`;
  html += `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">事件摘要</h3><p>${summaryHtml}</p></div>`;
  html += `<div id="fulltext-box" style="margin-top:14px;"></div>`;
  if (e.detail && e.detail !== e.summary) html += `<div><h3 style="margin:0 0 6px;">详细情况</h3><p>${esc(e.detail)}</p></div>`;
  html += `<div style="margin-top:14px;padding:12px;background:#fff8e1;border-radius:8px;"><b>安全建议：</b>${esc(e.advice)}</div>`;
  if (e.updates && e.updates.length) {
    html += `<div style="margin-top:14px;"><h3 style="margin:0 0 6px;">更新记录</h3><ul class="small">` +
      e.updates.map(u => `<li>${esc(u.note)} <span class="muted">(${fmtTimeBJ(u.ts)})</span></li>`).join("") + `</ul></div>`;
  }
  html += `<div style="margin-top:10px;">${flagTags(e)}</div>`;
  $("#detail").innerHTML = html;
  renderFulltext(e);
  $("#related").innerHTML = d.related.length ? d.related.map(x => eventCard(x)).join("")
    : `<div class="empty">暂无相关事件。</div>`;
}).catch(e => { $("#detail").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });
</script>
</body>
</html>
