克使馆发布安全提醒，建议在伊中国公民加强安全防范、减少非必要外出。\n  建议：在伊中方人员遵守使馆提醒，保持联络畅通。\n\n- 【中风险】伊拉克巴士拉省发生示威活动，部分道路短时封闭（伊拉克 巴士拉）\n  巴士拉省因民生与电力问题爆发示威，部分主干道短时封闭，未报告严重冲突。\n  建议：避开示威区域与封路路段，预留出行时间。\n\n### 以色列（当前风险：高风险）\n\n- 【高风险】以色列对黎巴嫩南部发动空袭（以色列 ）\n  以色列对黎巴嫩南部目标发动空袭，地区紧张局势升温。\n  建议：关注边境与北部地区安全动态。\n\n### 巴勒斯坦（当前风险：极高风险）\n\n- 【极高风险】巴勒斯坦加沙地带冲突持续，伤亡人数上升（巴勒斯坦 加沙）\n  加沙地带多地交火持续，报道称过去24小时伤亡人数上升，人道局势严峻。\n  建议：严禁前往冲突区域；在巴中方人员保持避险。\n\n### 阿联酋（当前风险：中风险）\n\n- 【中风险】阿联酋迪拜机场因沙尘暴航班大面积取消（阿联酋 迪拜）\n  强沙尘暴影响迪拜机场运行，多个进出港航班取消或延误。\n  建议：出行前确认航班状态，预留改签时间。\n\n### 约旦（当前风险：中风险）\n\n- 【中风险】约旦一处边境口岸临时关闭（约旦 ）\n  因安全核查，约旦一处主要边境口岸临时关闭，货运通关受影响。\n  建议：跨境运输提前确认通关状态。\n\n## 四、伊拉克安全形势\n\n### 伊拉克全国安全形势\n\n过去24小时收录伊拉克相关事件 4 条、过去72小时 4 条。存在需重点关注的恐袭、示威或能源设施风险。\n\n### 巴格达\n\n- 【高风险】巴格达发生汽车炸弹袭击，多人伤亡（伊拉克 巴格达）\n  巴格达一处人员密集市场发生汽车炸弹袭击，造成多人伤亡，尚无组织宣称负责。\n  建议：避免前往人员密集场所与市场；加强驻地安保。\n\n- 【中风险】中国驻伊拉克使馆发布安全提醒（伊拉克 巴格达）\n  中国驻伊拉克使馆发布安全提醒，建议在伊中国公民加强安全防范、减少非必要外出。\n  建议：在伊中方人员遵守使馆提醒，保持联络畅通。\n\n### 巴士拉\n\n- 【中风险】伊拉克巴士拉省发生示威活动，部分道路短时封闭（伊拉克 巴士拉）\n  巴士拉省因民生与电力问题爆发示威，部分主干道短时封闭，未报告严重冲突。\n  建议：避开示威区域与封路路段，预留出行时间。\n\n### 南部油气产区\n\n- 【高风险】伊拉克南部油气产区遭无人机袭击，设施轻微受损（伊拉克 ）\n  伊拉克南部一处油气产区遭无人机袭击，设施轻微受损，生产暂未中断。\n  建议：油气项目加强防空与周界警戒，检查应急通信。\n\n### 示威、罢工和封路\n\n- 【中风险】伊拉克巴士拉省发生示威活动，部分道路短时封闭（伊拉克 巴士拉）\n  巴士拉省因民生与电力问题爆发示威，部分主干道短时封闭，未报告严重冲突。\n  建议：避开示威区域与封路路段，预留出行时间。\n\n### 恐怖主义活动\n\n- 【高风险】巴格达发生汽车炸弹袭击，多人伤亡（伊拉克 巴格达）\n  巴格达一处人员密集市场发生汽车炸弹袭击，造成多人伤亡，尚无组织宣称负责。\n  建议：避免前往人员密集场所与市场；加强驻地安保。\n\n### 未来24至72小时趋势\n\n建议持续关注巴格达、巴士拉及南部油气产区的安全动态，重点防范示威封路、部落冲突与针对能源设施的袭击；如出现极高风险事件将及时更新本日报。\n\n## 五、涉及中国企业和中国公民的信息\n\n- 【中风险】中国驻伊拉克使馆发布安全提醒（伊拉克 巴格达）\n  中国驻伊拉克使馆发布安全提醒，建议在伊中国公民加强安全防范、减少非必要外出。\n  建议：在伊中方人员遵守使馆提醒，保持联络畅通。\n\n## 六、航空、领空和交通动态\n\n- 【中风险】约旦一处边境口岸临时关闭（约旦 ）\n  因安全核查，约旦一处主要边境口岸临时关闭，货运通关受影响。\n  建议：跨境运输提前确认通关状态。\n\n- 【中风险】阿联酋迪拜机场因沙尘暴航班大面积取消（阿联酋 迪拜）\n  强沙尘暴影响迪拜机场运行，多个进出港航班取消或延误。\n  建议：出行前确认航班状态，预留改签时间。\n\n## 七、风险分析与趋势研判\n\n- 【已确认事实】过去24小时共发布信息 8 条，其中高风险 3 条、极高风险 1 条；较前一日报新增 8 条。\n- 【趋势判断】风险上升的国家/地区：伊拉克、以色列、巴勒斯坦、阿联酋、约旦。\n- 【研判】存在极高风险事件，可能出现进一步升级，建议相关项目评估限制活动、停工或调整路线。\n- 【油气与海外企业影响】暂无直接影响油气项目运行的重大事件。\n- 【未来24小时关注】重点跟踪极高风险与高风险事件的后续进展、是否出现新示威/封路、机场与边境通行状态。\n- 【未来72小时变化】关注地区冲突是否外溢、重要节点（宗教/选举/经济）是否引发社会动荡。\n- 【不确定性】以上研判基于已收录公开信息，部分事件仍在发展中，最终以官方与权威来源通报为准。\n\n## 八、安全建议\n\n- 避开示威、游行和人员密集区域，避免靠近政府机构、油田及企业围堵现场。\n- 关注航班、机场与主要道路运行状态，提前确认出行路线，必要时调整或暂缓非必要出行。\n- 减少前往高风险地区，加强项目周边警戒与人员出行管理，落实夜间出行管控。\n- 伊拉克项目：重点加强巴格达、巴士拉及南部油气产区安保，检查应急通信与撤离路线。\n- 涉及中方人员：保持与使领馆及当地安保机构联系，及时报送人员动态。\n- 所有建议应结合当地最新官方通报与现场实际情况执行。\n"}, "date": "2026-07-16"}}, "proReports": [{"id": 8, "source_id": "pa_internationalsos", "org": "International SOS", "title_zh": "中东危机：旅行风险与安全更新", "title_orig": "Middle East Crisis: Travel Risk & Security Update", "author": null, "pub_date": "2026-06-26", "zh_pub_date": null, "update_time": null, "report_type": "旅行风险与安全建议", "countries": "伊朗;以色列;伊拉克;黎巴嫩;约旦;科威特;阿曼;卡塔尔;沙特;阿联酋;叙利亚;也门;埃及;土耳其", "regions": "中东与北非", "risk_category": "旅行安全/地缘政治", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "International SOS 发布中东危机旅行风险与安全更新，给出分国别建议：推迟一切前往伊朗的入境旅行，在伊外国公民应利用可用选项离境；推迟前往以色列与巴勒斯坦领土的旅行；对巴林、伊拉克、约旦、科威特、阿曼、卡塔尔、沙特、阿联酋、叙利亚等国的商务关键旅行\"可能可行\"，但须计入敌对行动快速重启、空域关闭、航班取消与中断的可信风险，并保持行程灵活；黎巴嫩推迟一切旅行。\\n对在地区内人员，建议：若空中袭击重启，准备就地避难（shelter in place）；遵守官方指令与撤离程序；为航班中断与短通知空域关闭做好准备；美方与以方国民应在整个中东与北非保持低调、避开美以军事与外交设施。报告强调仅依据 International SOS 警报、外交机构与当地联系人等\"已核实来源\"行动，不传播未核实信息。（注：International SOS 对伊拉克的常设评级为 EXTREME 旅行风险与 EXTREME 医疗风险，联邦伊拉克多数省份应规避旅行，巴格达与南部省份仅限商务关键并需专业安保支持。）", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://media.internationalsos.com/insights/tensions-wider-middle-east", "archive_time": null, "core_conclusion": "中东危机下，伊朗/以色列/黎巴嫩推迟旅行，伊拉克等商务关键旅行须计入空域关闭与中断风险；在伊人员准备就地避难、保持低调。", "key_risks": "地区空域关闭与航班取消；导弹/无人机袭击外溢；美以外交军事设施受威胁；未核实信息误导。", "org_forecast": "地区敌对行动可能快速重启；空域与边境中断具短通知特征；风险偏好因行业/人员而异。", "warning_indicators": "空域关闭声明；外交机构撤离令；航班大规模取消。", "impact_mena": "整个中东与北非旅行与运营环境高度不稳定，多国商务关键旅行受限。", "impact_iraq": "直接：伊拉克为 EXTREME 旅行风险，巴格达与南部省份仅限商务关键+专业安保，人员撤离与差旅管控须升级。", "impact_basra": "直接：巴士拉属南部高脆弱省份，人员差旅与营地安保须按 EXTREME 风险等级管理。", "impact_wq1": "直接：WQ1（西古尔纳一号）运营人员在伊面临 EXTREME 旅行与医疗风险，撤离预案与就地避难准备必须到位。", "platform_analysis": "本平台提示：International SOS 的 EXTREME 评级与\"就地避难\"建议，直接对应驻伊（含巴士拉/WQ1）中方人员的差旅审批、撤离预案与医疗安保安排，建议据此复核人员管理政策。", "credibility": 3, "track_needed": 1, "wq1_relevance": "direct", "copyright_status": "summary_only", "content_categories": null, "priority_region": 1, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}, {"id": 6, "source_id": "pa_ambrey", "org": "Ambrey", "title_zh": "索马里海盗活动加剧（亚丁湾/印度洋）", "title_orig": "INCREASED SOMALI PIRACY ACTIVITY", "author": null, "pub_date": "2026-06-24", "zh_pub_date": null, "update_time": null, "report_type": "海上安全威胁通告 (Threat Circular)", "countries": "索马里;也门", "regions": "亚丁湾;印度洋;红海", "risk_category": "海事安全/海盗", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "英国海上安全公司 Ambrey（Ambrey Analytics Ltd）发布威胁通告：2026 年 6 月索马里海盗行动组（PAG）活动显著增强，仅亚丁湾一带就报告至少 5 起可疑接近事件，且手段日趋激进、袭击者频繁开火。4 月 21 日至 5 月 2 日间曾有至少 3 艘商船（两艘油化品船、一艘杂货船）被成功劫持并扣留在索马里印度洋领海已知扣押区；此后未再发生成功劫持，但 7 月 7 日也报告一艘化学品船在也门外海被武装人员登船（疑似索马里海盗）。\\nAmbrey 指出，近期事件确认了已知能力：武装安保（BMP-MS 与私营武装保安队 PAST）高度可能阻止了更多商船被劫。季风季预计持续至约 9 月，有利于海盗活动扩散至亚丁湾更广范围。登船团伙通常 6–11 名武装人员，乘多艘小艇，装备 AK 系步枪，部分携带 RPG。", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://ambrey.com/operations/event/increased-somali-piracy-activity/", "archive_time": null, "core_conclusion": "2026 年 6 月索马里海盗活动在亚丁湾/印度洋明显加剧，多起可疑接近与劫持事件；季风季将延续至约 9 月，航运风险上升。", "key_risks": "亚丁湾/印度洋可疑接近与开火；商船被劫持并扣为人质；小艇武装登船；季风季延长海盗窗口。", "org_forecast": "索马里 PAG 将持续机会主义行动；近期事件确认其已知能力，武装安保高度可能阻止进一步劫持。", "warning_indicators": "亚丁湾国际推荐过境走廊（IRTC）北侧及以北的可疑接近增加；无武装保安团队成员的商船风险最高。", "impact_mena": "红海/亚丁湾航运安全环境恶化，影响经曼德海峡的全球贸易与能源运输通道。", "impact_iraq": "间接：亚丁湾航运受扰推高保险与运费，影响伊拉克（经波斯湾/红海）能源出口物流成本。", "impact_basra": "间接：巴士拉原油出口高度依赖海运通道，红海/亚丁湾风险推高航运保险与延误。", "impact_wq1": "间接：WQ1 原油出口经海湾—红海航线，海盗与航运风险叠加将影响运输成本与排期。", "platform_analysis": "本平台提示：该通告虽非直接针对伊拉克，但红海/亚丁湾航运风险与霍尔木兹局势叠加，共同影响伊拉克能源出口通道（含 WQ1 原油外运）的安全与成本，建议纳入物流风险监测。", "credibility": 3, "track_needed": 1, "wq1_relevance": "indirect", "copyright_status": "summary_only", "content_categories": null, "priority_region": 2, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}, {"id": 7, "source_id": "pa_dryad", "org": "Dryad Global", "title_zh": "霍尔木兹海峡风险更新：海湾袭击、水雷威胁与海上网络风险", "title_orig": "Strait of Hormuz Risk Update: Gulf Attacks, Mine Threats and Maritime Cyber Risk", "author": null, "pub_date": "2026-06-01", "zh_pub_date": null, "update_time": null, "report_type": "海上情报简报 (Maritime Intelligence Brief)", "countries": "伊朗;阿曼;科威特;伊拉克", "regions": "霍尔木兹海峡;波斯湾;阿曼湾", "risk_category": "海事安全/地缘政治", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "Dryad Global 海上情报简报评估：波斯湾、霍尔木兹海峡与阿曼湾的风险环境急剧恶化。2026 年 6 月 1 日，伊朗力量在波斯湾重启直接攻击，在乌姆卡斯尔东南约 40 海里处用无人水面艇（USV）袭击商船 Sarisha V；协同升级中，一枚法塔赫-110 弹道导弹射向科威特阿里塞勒姆空军基地，拦截后碎片据报造成 5 名美军人员与承包商受伤。简报还评估霍尔木兹海峡水雷威胁持续——5 月 30 日阿曼领海发现一枚水雷。\\n除物理海上威胁外，本期简报关注网络风险：与中国相关的 APT 组织正利用地区不稳定 targeting 中东的海上、能源与邮轮行业；嘉年华公司数据泄露凸显邮轮乘客数据面临的网络犯罪风险。对船东、运营商、保险与安全团队的核心信息：海事风险已不再局限于海上，动能威胁、水雷、网络间谍、数据窃取与地缘不稳正汇合。简报给出未来 30–60 天的前瞻风险评估。", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://channel16.dryadglobal.com/archive/strait-of-hormuz-risk-update-gulf-attacks-cyber-threats", "archive_time": null, "core_conclusion": "波斯湾/霍尔木兹/阿曼湾风险急剧恶化：伊朗 USV 与导弹袭击商船与基地、水雷威胁持续，叠加海上网络风险；未来 30–60 天高度不稳定。", "key_risks": "伊朗 USV/导弹袭击商船；霍尔木兹水雷；GPS/AIS 干扰；海上与能源行业网络攻击；商业交通改道与保险影响。", "org_forecast": "未来 30–60 天风险前景高度不稳定；水雷仍是有信誉的升级选项（即便有限快速布设也能在窄航道造成不成比例扰动）。", "warning_indicators": "商船在霍尔木兹/阿曼湾遇袭；水雷发现；GNSS/AIS 干扰加剧；海湾空域关闭。", "impact_mena": "海湾与东地中海航空、海上交通与商业运营将因袭击、空域关闭与保险限制持续中断。", "impact_iraq": "潜在：伊拉克石油出口高度依赖波斯湾—霍尔木兹通道，海峡受阻将直接冲击出口能力与运费。", "impact_basra": "潜在：巴士拉原油经波斯湾出海，霍尔木兹受阻将直接推高出口风险与成本。", "impact_wq1": "潜在：WQ1（西古尔纳一号）原油外运经波斯湾—霍尔木兹，海峡风险直接关系出口通道安全与排期。", "platform_analysis": "本平台提示：Dryad 将霍尔木兹列为\"动能+水雷+网络\"三重风险叠加，这直接关联伊拉克（含巴士拉/WQ1）原油出口通道的安全与成本，建议作为能源物流风险的核心监测项。", "credibility": 3, "track_needed": 1, "wq1_relevance": "potential", "copyright_status": "summary_only", "content_categories": null, "priority_region": 1, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}, {"id": 10, "source_id": "pa_crisis24", "org": "Crisis24", "title_zh": "中东风险格局更新：海湾空域波动、伊朗决策分裂与伊拉克威胁", "title_orig": "Middle East Risk Landscape Update: Gulf Airspace Volatility, Iranian Decision-Making, Iraq Threats", "author": null, "pub_date": "2026-03-07", "zh_pub_date": null, "update_time": null, "report_type": "每日情报简报 (Daily Intelligence Brief)", "countries": "伊朗;伊拉克;海湾国家", "regions": "海湾;中东", "risk_category": "地缘政治/航空安全", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "Crisis24 每日情报简报（2026 年 3 月 7 日）概述塑造风险格局的三大动向：其一，海湾空域持续波动——尽管卡塔尔至欧洲有有限撤侨航班，伊拉克已将空域关闭至少延至周二，欧洲监管方继续建议避免飞越（至 3 月 11 日）；海湾上空的导弹与无人机活动使民航风险居高不下。\\n其二，伊朗决策出现\"分裂\"迹象，升高了突然升级与地区外溢风险：相互矛盾的政治信号、代理打击与扩张的目标集指向伊朗指挥控制不清晰。其三，外国国民（尤其伊拉克）的威胁环境正在恶化：在埃尔比勒一家酒店遭无人机袭击后，民兵可能 targeting 与西方外国人相关的地点；能源设施亦遭打击，部分能源企业已撤离人员。关键建议：组织应限制海湾与伊拉克的非必要旅行，复核撤离预案，并为突然的空域或安全中断做好准备。", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://www.linkedin.com/posts/crisis24_crisis24dailyintelligencebrief-activity-7436049626295836672-YTbF", "archive_time": null, "core_conclusion": "海湾空域波动、伊朗决策分裂升高升级风险、伊拉克外国人员威胁恶化；建议限制非必要旅行并复核撤离预案。", "key_risks": "海湾空域关闭与导弹/无人机活动；伊朗代理人目标扩张；伊拉克西方人员设施受袭；能源企业人员撤离。", "org_forecast": "海湾空域与安全风险将持续波动；代理活动扩张；西方关联人员与能源设施暴露上升。", "warning_indicators": "伊拉克空域关闭延长；埃尔比勒等地酒店/设施遇袭；能源企业撤离人员。", "impact_mena": "海湾与伊拉克航空、能源与人员安全风险全面上升。", "impact_iraq": "直接：伊拉克外国人员与西方关联设施威胁恶化，埃尔比勒酒店遇袭，能源企业撤离人员。", "impact_basra": "直接：巴士拉及南部省份能源设施属潜在打击目标，人员安全风险上升。", "impact_wq1": "直接：WQ1（西古尔纳一号）人员与能源设施安保受伊拉克威胁环境恶化直接影响。", "platform_analysis": "本平台提示：该简报将伊拉克西方人员与能源设施列为直接威胁对象，与驻伊（含巴士拉/WQ1）中方运营的人员撤离、营地安保等级评估直接相关。", "credibility": 3, "track_needed": 1, "wq1_relevance": "direct", "copyright_status": "summary_only", "content_categories": null, "priority_region": 1, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}, {"id": 5, "source_id": "pa_crisis24", "org": "Crisis24", "title_zh": "伊朗：处于生存威胁阈值之上的报复算计", "title_orig": "Iran: Retaliation Calculus at the Threshold of an Existential Threat", "author": null, "pub_date": "2026-01-30", "zh_pub_date": null, "update_time": null, "report_type": "地缘政治风险分析", "countries": "伊朗;伊拉克;以色列;科威特;巴林;美国", "regions": "海湾;中东", "risk_category": "武装冲突/地缘政治", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "Crisis24 中东情报团队分析称，随着美伊紧张升级，任何重大美方动能打击都几乎必然触发伊朗对海湾地区美军的报复，且对以色列的威胁\"明确且具备行动可信度\"。伊朗官员已威胁打击\"特拉维夫心脏\"。外交努力难以形成可行的降级出口，因美伊在弹道导弹、代理人活动与地区姿态上的立场根本不可调和。\\n operational 层面，伊朗视美方打击为政权生存的生存威胁，显著改变其报复算计，更可能作出更广泛、约束力更低的回应。伊朗在伊拉克的盟友民兵仍具备打击美及其他西方政府外交设施的能力，尤其是巴格达。海湾/东地中海的航空、海上交通与商业运营将因空域关闭、军事活动增加与保险/监管限制而持续中断。伊朗国内应急准备（授权省长紧急权）显示其正为长期而非短期冲突做准备。", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://www.crisis24.com/articles/iran-retaliation-calculus-at-the-threshold-of-an-existential-threat", "archive_time": null, "core_conclusion": "美伊冲突一旦升级，伊朗将几乎必然报复海湾美军与以色列；伊拉克亲伊朗民兵具备打击西方外交设施能力，地区空域与航运面临持续中断。", "key_risks": "伊朗对海湾美军基地报复；伊拉克亲伊朗民兵袭击西方外交设施；海湾空域关闭与航运中断；伊朗网络/代理人行动。", "org_forecast": "即便有限的美方打击也将立即改变地区安全环境；伊朗回应将是\"展示决心同时管控升级\"的校准式回应，可能包括导弹/无人机、网络、可否认代理人活动。", "warning_indicators": "海湾空域关闭声明；伊朗代理人在伊拉克的活动增加；外交设施周边威胁升高。", "impact_mena": "海湾与东地中海航空、海上交通与商业运营将因空域关闭与军事活动持续中断。", "impact_iraq": "直接：伊拉克亲伊朗民兵具备打击美/西方外交设施能力，巴格达等地西方人员风险显著上升。", "impact_basra": "巴士拉及南部省份受地区冲突外溢与航运中断间接影响，能源设施亦可能为潜在打击目标。", "impact_wq1": "直接：伊拉克安全环境恶化、亲伊朗民兵活动上升，直接抬高 WQ1（西古尔纳一号）人员与设施安保风险。", "platform_analysis": "本平台提示：该分析将伊拉克西方人员与设施列为直接受威胁对象，与中方在伊运营（含 WQ1）的人员撤离预案、营地安保等级评估高度相关，建议纳入风险监测。", "credibility": 3, "track_needed": 1, "wq1_relevance": "direct", "copyright_status": "summary_only", "content_categories": null, "priority_region": 1, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}, {"id": 4, "source_id": "pa_crisis24", "org": "Crisis24", "title_zh": "2026 年恐怖主义展望：威胁、战术与全球影响", "title_orig": "Terrorism Outlook 2026: Threats, Tactics, and Global Implications", "author": null, "pub_date": "2026", "zh_pub_date": null, "update_time": null, "report_type": "年度风险展望", "countries": "伊拉克;叙利亚;也门;埃及;阿富汗;巴基斯坦", "regions": "中东与北非;萨赫勒;南亚", "risk_category": "恐怖主义/武装冲突", "forecast_range": null, "orig_lang": "en", "content_type": "summary", "content_zh": "Crisis24 发布 2026 年全球恐怖主义展望，判断 2026 年恐怖主义将呈现\"在脆弱环境中巩固影响力与作战能力\"而非全球复兴的特征。在中东与北非部分，报告指叙利亚与伊拉克的\"伊斯兰国\"（IS）残余维持分散化网络，以暗杀、伏击、突袭为主要方式，而非占据领土；叙利亚东北部局势（叙利亚政府从库尔德主导的 SDF 夺取领土）因部落矛盾与地方积怨仍将脆弱。也门方面，IS 与阿拉伯半岛基地组织（AQAP）几乎肯定会利用持续内战，打击政府目标、安全部队与基础设施，并偶尔跨境行动。埃及与利比亚的激进活动虽被显著削弱，但仍是持久威胁，西奈半岛为埃及主要热点。报告认为，治理真空、经济脆弱与教派紧张为中东北非的 militant 行动提供了沃土，并提醒企业：在叙利亚、伊拉克、也门等地运营面临叛乱袭击与教派冲突风险；地缘 distraction 可能降低全球反恐注意力，使 militant 网络更自由地活动。\\n对平台意义：该展望将伊拉克列为 2026 年最可能出现攻击的脆弱区域之一，与巴士拉/伊拉克运营（含 WQ1 相关中方资产）的安防规划直接相关。", "copyright_owner": null, "copyright_note": null, "license_type": null, "reprint_basis": null, "commercial_allowed": 0, "modifiable": 0, "license_link": null, "orig_link": "https://www.crisis24.com/en/articles/terrorism-outlook-2026-threats-tactics-and-global-implications", "archive_time": null, "core_conclusion": "2026 年恐怖主义在多脆弱地区巩固而非复兴；伊拉克与叙利亚 IS 残余、也门 AQAP 将持续构成分散化威胁，企业须维持高强度安防。" n": "2026 年全球安全威胁以持久冲突与混合战争为主线；伊朗内部承压但政权稳固，在伊盟友民兵活动可能在选举前升温。", "key_risks": "伊朗内部压力与潜在抗议；在伊盟友民兵袭击基础设施；核与导弹能力重建；代理人活动持续。", "org_forecast": "冲突将制度化与长期化；伊朗重建军事能力但保持克制以避免进一步空袭；代理人活动延续。", "warning_indicators": "伊朗国内抗议；伊拉克基础设施遭民兵袭击增加；核/导弹相关动态。", "impact_mena": "中东持续处于代理人冲突与地缘紧张之中，安全环境结构性脆弱。", "impact_iraq": "间接：伊朗在伊盟友民兵对基础设施与机构的袭击可能在选举前加剧，抬高驻伊人员与资产风险。", "impact_basra": "间接：巴士拉及南部省份受代理人活动与基础设施袭击风险外溢影响。", "impact_wq1": "间接：伊拉克代理人活动与基础设施袭击风险，构成 WQ1 运营环境的背景性安全隐患。", "platform_analysis": "本平台提示：Janes 将伊拉克代理人袭击列为选举前升温风险，与巴士拉/WQ1 基础设施安保直接相关，建议结合本地简报监测 militia 动向。", "credibility": 3, "track_needed": 1, "wq1_relevance": "indirect", "copyright_status": "summary_only", "content_categories": null, "priority_region": 2, "priority_themes": null, "status": "published", "created_at": "2026-07-18T19:59:45Z", "updated_at": "2026-07-18T19:59:45Z"}]};</script>
<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    var arr = (DB && DB.proReports) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      return { reports: arr, count: arr.length, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();

  if (b.type === "event") {
    const e = b;
    return `<div class="panel" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <b>${riskBadge(e.risk)} ${esc(e.title)}</b></div>
      <div class="small muted">${esc(e.country || "")} ${esc(e.city || "")} · ${esc(e.category || "")} · ${fmtTime(e.time)}</div>
      ${e.summary ? `<p class="small" style="margin:6px 0;">${esc(e.summary)}</p>` : ""}
      ${e.impact ? `<div class="small">影响：${esc(e.impact)}</div>` : ""}
      ${e.advice ? `<div class="small" style="color:var(--accent);">建议：${esc(e.advice)}</div>` : ""}
      ${e.url ? `<div class="small"><a href="${esc(e.url)}" target="_blank" rel="noopener">来源：${esc(e.source || "")}</a></div>` : (e.source ? `<div class="small muted">来源：${esc(e.source)}</div>` : "")}
    </div>`;
  }
  return "";
}

API.get("/api/report/" + encodeURIComponent(getQS("d") || "")).then(d => {
  const r = d.report;
  if (!r) { $("#report").innerHTML = `<div class="empty">未找到该日报。</div>`; return; }
  _md = r.markdown || "";
  let html = `<h1 style="margin:0 0 4px;">《中东地区社会安全信息日报》（${r.date}）</h1>
    <p class="muted small">生成时间（伊拉克）：${esc(r.generated_at_baghdad || "")}</p>`;
  (r.sections || []).forEach(s => {
    html += `<div class="report-sec"><h2>${esc(s.title)}</h2>`;
    (s.blocks || []).forEach(b => { html += blockHtml(b); });
    html += `</div>`;
  });
  $("#report").innerHTML = html;
}).catch(e => { $("#report").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });

function copyReport() {
  if (!_md) return toast("暂无可复制内容");
  navigator.clipboard.writeText(_md).then(() => toast("日报已复制到剪贴板")).catch(() => toast("复制失败，请手动选择"));
}
</script>
</body>
</html>
