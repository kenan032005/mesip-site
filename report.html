<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  // 构建元数据（控制台/调试用）：build_timestamp / git_commit / public_report_count / schema_version
  try {
    var _bm = (DB && DB.build_meta) || null;
    if (_bm) {
      window.__MESIP_BUILD__ = _bm;
      console.info("[MESIP 静态构建] " + (_bm.build_timestamp || "") + " | commit=" + (_bm.git_commit || "") +
        " | 专业报告(published)=" + (_bm.public_report_count) + " | schema=" + (_bm.schema_version || ""));
    }
  } catch (e) {}

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    // 详情优先从 proDetail（含全文翻译字段）查询，回退到列表精简版
    var arr = (DB && DB.proDetail) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    arr = (DB && DB.proReports) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String(arr[j].id) === String(id)) return arr[j];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/home") return DB.home;
    if (path === "/api/hormuz") return { report: DB.hormuz };
    if (path === "/api/brent") return DB.brent;
    if (path.indexOf("/api/reuters") === 0) return DB.reuters || { items: [], count: 0 };
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      // 默认仅返回 published（与 server.py _pro_public_filters 一致），export=all 解除限制
      var xpt = p.get("export");
      if (xpt !== "all") { arr = arr.filter(function (x) { return x.status === "published"; }); }
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var dom = p.get("domain");
      if (dom) arr = arr.filter(function (x) { return (x.content_categories || "").indexOf(dom) >= 0; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var rg = p.get("region");
      if (rg) arr = arr.filter(function (x) { return (x.regions || x.countries || "").indexOf(rg) >= 0; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      // 分页（与 server.py api_pro_reports 一致）
      var total = arr.length;
      var pg = parseInt(p.get("page") || "1", 10); if (!pg || pg < 1) pg = 1;
      var psz = parseInt(p.get("page_size") || "0", 10); if (!psz || psz < 0) psz = 0;
      if (psz > 100) psz = 100;
      var out = arr;
      if (psz > 0) out = arr.slice((pg - 1) * psz, pg * psz);
      return { reports: out, count: out.length, total: total, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-institutions") === 0) {
      return DB.proInstitutions || { institutions: [], count: 0 };
    }
    if (path.indexOf("/api/decision-brief") === 0) {
      // Stage 4（2026-08-05）：决策型日报静态路由
      var q = new URLSearchParams(path.split("?")[1] || "");
      var ddate = q.get("date") || "";
      var arr = DB.decisionBriefs || [];
      if (ddate) {
        var hit = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i].brief_date === ddate) { hit = arr[i]; break; } }
        return { brief: hit };
      }
      return { brief: arr.length ? arr[0] : null };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("reports.html");
let _md = "";
let _reportData = null;

// ====== 加载 ======
const dateParam = getQS("d") || "";
const today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
document.getElementById("datePicker").value = dateParam || today;

API.get("/api/report/" + encodeURIComponent(dateParam || "")).then(d => {
  const r = d.report;
  if (!r) { $("#report").innerHTML = `<div class="empty">该日期暂无日报。<br><br><a href="reports.html">查看所有日报</a></div>`; return; }
  _reportData = r;
  _md = r.markdown || "";
  // 决策型日报（decision_briefs）：有 V2 完整日报则默认展示；
  // 无则回退 V1 简报，仍无则回退旧版新闻日报（均为后台降级逻辑，无公开版本入口）。
  const bDate = dateParam || today;
  API.get("/api/decision-brief?date=" + encodeURIComponent(bDate)).then(dd => {
    const brief = dd && dd.brief;
    if (brief && brief.content_version === "v2" && brief.full_report_html) {
      $("#report").innerHTML = brief.full_report_html;
      setupDetailToggles();
    } else if (brief) {
      $("#report").innerHTML = renderDecisionBrief(brief, r);
      setupDetailToggles();
    } else {
      $("#report").innerHTML = renderReport(r);
      setupDetailToggles();
    }
  }).catch(() => {
    $("#report").innerHTML = renderReport(r);
    setupDetailToggles();
  });
}).catch(e => { $("#report").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; });

// ====== 决策型日报渲染（后台降级）======
var __LvCn = {rising:"上升", stable_high:"高位趋稳", stable:"持平", easing:"缓和", volatile:"波动", insufficient_data:"数据不足"};
var __LvAlert = {critical:"严重", high:"高", watch:"关注", info:"提示"};

function renderDecisionBrief(b, oldR) {
  const es = oldR ? (oldR.executive_summary || {}) : {};
  const matrix = b.wq1_impact_matrix || {};
  const scenarios = b.scenario_assessment || [];
  const actions = b.recommended_actions || [];
  const alerts = b.active_alert_ids || [];
  const changes = b.key_change_items || [];
  const regional = (typeof b.regional_assessment === "string" && b.regional_assessment) ? {} : (b.regional_assessment || {});
  let h = "";
  h += `<div class="obs-header">
    <h1>${esc(oldR ? oldR.title : "伊拉克及周边区域社会安全形势日报")}</h1>
    
    <div class="obs-meta">
      <div>📅 报告日期：<b>${esc(b.brief_date || "")}</b></div>
      <div>⏱ 信息窗口：<b>${esc((b.period_start||"").slice(0,16))} → ${esc((b.period_end||"").slice(0,16))}</b></div>
      <div>🔄 趋势：<b>${esc(b.overall_risk_trend || "")}</b></div>
      <div>🏷 状态：<b>${esc(b.quality_gate || "")}</b></div>
    </div>
  </div>`;
  // 一、核心判断
  h += `<div class="exec-card"><h2>一、今日核心判断</h2><div class="total-line">${esc(b.executive_judgment || "")}</div></div>`;
  // 二、重点风险预警
  h += `<div class="exec-card"><h2>二、重点风险预警（${alerts.length}条）</h2>`;
  if (alerts.length) {
    h += `<ul>${alerts.map(a => `<li><b>[${esc(__LvAlert[a.level] || a.level || "高")}]</b> ${esc(a.title || a)}</li>`).join("")}</ul>`;
    h += `<p class="small muted">预警与 Stage 2 引擎完全一致，详见原文链接。</p>`;
  } else {
    h += `<p><b>当前未发现需要升级处置的重大外部风险。</b></p>`;
  }
  h += `</div>`;
  // 三、关键变化
  h += `<div class="exec-card"><h2>三、今日关键变化</h2>`;
  if (changes.length) {
    h += `<ul>${changes.map(c => `<li><b>${esc(c.change_type || c.risk_name || "")}</b>：${esc(c.risk_name || c.what_happened || c.change_reason || "")}</li>`).join("")}</ul>`;
  } else {
    h += `<p>本周期无发生实质变化的关键事项。</p>`;
  }
  h += `</div>`;
  // 四、区域态势
  h += `<div class="exec-card"><h2>四、区域态势研判</h2>`;
  if (typeof b.regional_assessment === "string" && b.regional_assessment) {
    h += `<p>${esc(b.regional_assessment)}</p>`;
  } else {
    h += `<ul>${Object.entries(regional).map(([k,v]) => `<li><b>${esc(k)}：</b>${esc(v)}</li>`).join("")}</ul>`;
  }
  h += `</div>`;
  // 五、WQ1 影响矩阵
  h += `<div class="exec-card"><h2>五、WQ1 影响矩阵</h2><table class="tbl"><tr><th>维度</th><th>当前</th><th>趋势</th><th>说明</th></tr>`;
  Object.entries(matrix).forEach(([k,v]) => {
    h += `<tr><td>${esc(v.dimension || k)}</td><td><b>${esc(v.current_level || "")}</b></td><td>${esc(__LvCn[v.trend] || v.trend || "")}</td><td>${esc(v.reason || "")}</td></tr>`;
  });
  h += `</table></div>`;
  // 六、情景
  h += `<div class="exec-card"><h2>六、未来24-72小时情景</h2>`;
  if (scenarios.length) {
    scenarios.forEach(s => {
      h += `<div class="scenario"><b>${esc(s.scenario_name || "")}</b>（可信度：${esc(s.confidence_level || "")}）`;
      if (s.scenario_description) h += `<div>${esc(s.scenario_description)}</div>`;
      if (s.trigger_conditions && s.trigger_conditions.length) h += `<div class="small muted">触发条件：${esc(s.trigger_conditions.join("；"))}</div>`;
      if (s.wq1_impacts) h += `<div class="small muted">对WQ1影响：${esc(s.wq1_impacts)}</div>`;
      h += `</div>`;
    });
  } else {
    h += `<p>当前证据不足，暂不生成情景判断。</p>`;
  }
  h += `</div>`;
  // 七、建议
  h += `<div class="exec-card"><h2>七、建议和监测事项</h2><ul>`;
  if (actions.length) {
    actions.forEach(a => { h += `<li><b>[${esc(a.priority || "")}]</b> ${esc(a.action || "")}</li>`; });
  } else {
    h += `<li>暂无需要采取的具体行动，维持常规监测。</li>`;
  }
  h += `</ul></div>`;
  // 八、专业机构观点（从 evidence map 找）
  const em = b.brief_evidence_map || [];
  const proRefs = em.filter(e => e.evidence_type === "pro_report");
  h += `<div class="exec-card"><h2>八、专业机构观点</h2>`;
  if (proRefs.length) {
    h += `<p class="small muted">本周期引用 ${proRefs.length} 篇 Stage 3 合格专业内容（证据映射可追溯）。</p>`;
  } else {
    h += `<p>本周期未引用专业机构观点。</p>`;
  }
  h += `</div>`;
  // 九、来源
  const links = b.source_links || [];
  h += `<div class="exec-card"><h2>九、信息来源</h2>`;
  if (links.length) {
    h += `<ul>${links.slice(0,15).map(l => `<li>${esc(l.source || "")}：<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc((l.url||"").slice(0,60))}</a></li>`).join("")}</ul>`;
  } else {
    h += `<p class="small muted">来源详见旧版日报「主要信息来源」。</p>`;
  }
  h += `</div>`;

  h += `<div id="legacyReport" style="display:none;margin-top:12px;">${renderReport(oldR)}</div>`;
  return h;
}

function goDate() {
  const d = document.getElementById("datePicker").value;
  if (d) location.href = "report.html?d=" + d;
}

// ====== 渲染 ======
function renderReport(r) {
  const es = r.executive_summary || {};
  const riskDot = l => `<span class="risk-dot l${l}"></span>`;

  let h = "";

  // === 报头 ===
  h += `<div class="obs-header">
    <h1>${esc(r.title)}（${r.date}）</h1>
    <p class="sub">${esc(r.subtitle || "中东社会安全、地缘政治与企业运营风险分析")}</p>
    <div class="obs-meta">
      <div>📅 发布日期：<b>${r.date}</b></div>
      <div>🕐 伊拉克时间：<b>${esc(r.time_baghdad || "")}</b></div>
      <div>🕗 北京时间：<b>${esc(r.time_beijing || "")}</b></div>
      <div>⏱ 数据截止：<b>${esc((r.data_cutoff || "").slice(0,16))}</b></div>
      <div>🏴 中东整体风险：<b>${riskDot(r.overall_risk_level)}${r.overall_risk}</b></div>
      <div>🇮🇶 伊拉克风险：<b>${riskDot(r.iraq_risk_level)}${r.iraq_risk}</b></div>
      <div>🏭 巴士拉风险：<b>${riskDot(r.basra_risk_level)}${r.basra_risk}</b></div>
      <div>🔗 WQ1关联：<b>${r.wq1_risk}</b></div>
      <div>📊 趋势：<b>${r.trend_vs_prev}</b></div>
      <div>🔄 版本：${r.version || "2.0"}</div>
    </div>
  </div>`;

  // === 管理层摘要 ===
  h += `<div class="exec-card">
    <h2>📋 管理层摘要</h2>
    <div class="total-line">${esc(es.overall || "")}</div>
    <div class="changes"><b>关键变化：</b><ul>${(es.changes || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
    <div class="quick-grid">
      <div>🇮🇶 <b>伊拉克：</b>${esc(es.iraq || "")}</div>
      <div>🏭 <b>巴士拉：</b>${esc(es.basra || "")}</div>
      <div>🔗 <b>WQ1：</b>${esc(es.wq1 || "")}</div>
      <div>⚠️ <b>最大风险(72h)：</b>${esc(es.max_risk_72h || "")}</div>
    </div>
  </div>`;

  // === 目录 ===
  h += `<div class="obs-toc">
    <h3>目录</h3>
    <ol>${(r.sections || []).map((s, i) => `<li><a href="#s${i}">${esc(s.title)}</a></li>`).join("")}</ol>
  </div>`;

  // === 各章节 ===
  (r.sections || []).forEach((s, si) => {
    h += `<div class="obs-sec" id="s${si}"><h2>${esc(s.title)}</h2>`;
    (s.blocks || []).forEach(b => {
      h += renderBlock(b);
    });
    h += `</div>`;
    if (si < 9) h += `<p style="text-align:right;"><a href="#s0">↑ 返回顶部</a></p>`;
  });

  // === 来源（兜底：仅当正文无 source_group 章节时才自动渲染，避免重复）===
  const hasSrcSec = (r.sections || []).some(s => (s.blocks || []).some(b => b.type === "source_group"));
  if (r.sources_by_category && !hasSrcSec) {
    const nAll = Object.values(r.sources_by_category).reduce((a, c) => a + (c ? c.length : 0), 0);
    h += `<div class="source-section"><h2>主要信息来源（${nAll}条）</h2>`;
    const cats = r.sources_by_category;
    for (const [cat, items] of Object.entries(cats)) {
      h += `<div class="source-group"><h4>${esc(cat)}（${items.length}条）</h4>
        <table class="src-table"><tr><th>序号</th><th>机构</th><th>标题</th><th>时间</th><th>链接</th></tr>
        ${items.map(s => `<tr><td>[${s.ref}]</td><td>${esc(s.org)}</td><td>${esc((s.title||"").slice(0,60))}</td><td>${esc((s.time||"").slice(0,16))}</td><td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">原文</a>` : '-'}</td></tr>`).join("")}
        </table></div>`;
    }
    h += `</div>`;
  }

  return h;
}

// ====== 块渲染 ======
function renderBlock(b) {
  const t = b.type;
  let a, i;

  if (t === "core_intro") {
    let h = `<div class="an-p"><p>${esc(b.text || "")}</p>`;
    for (const kc of (b.key_changes || [])) {
      h += `<div class="an-fact">
        <p><b>${esc(kc.what)}：</b>${esc(kc.diff)}</p>
        <p>这说明 ${esc(kc.why)}</p>
        <p>趋势：${esc(kc.trend)} | 外溢风险：${esc(kc.spillover)}</p>
        <p>对企业的意义：${esc(kc.implication)}</p>
      </div>`;
    }
    h += `</div>`;
    return h;
  }

  if (t === "summary") {
    return `<div class="an-judge">
      <p><b>${esc(b.overall || "")}</b></p>
      <p>${esc(b.region_type || "")} ${esc(b.biz_impact || "")}</p>
    </div>`;
  }

  if (t === "analysis") {
    return (b.text || []).map(line =>
      `<div class="an-p">${esc(line)}</div>`
    ).join("");
  }

  if (t === "subheading") {
    return `<h3>${esc(b.text)}</h3>`;
  }

  if (t === "list") {
    return `<ul>${(b.items || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  }

  if (t === "table") {
    const hds = (b.headers || []).map(h => `<th>${esc(h)}</th>`).join("");
    const rows = (b.rows || []).map(r =>
      `<tr>${r.map(x => `<td>${esc(String(x))}</td>`).join("")}</tr>`).join("");
    return `<div style="overflow-x:auto;"><table class="chg-table"><tr>${hds}</tr>${rows}</table></div>`;
  }

  if (t === "scenarios") {
    return (b.scenarios || []).map(sc => `
      <div class="sc-card">
        <h4>${esc(sc.name)}</h4>
        <p><b>触发条件：</b>${esc(sc.trigger)}</p>
        <p><b>可能发展：</b>${esc(sc.development)}</p>
        <p><b>对伊拉克影响：</b>${esc(sc.iraq_impact)}</p>
        <p><b>对巴士拉影响：</b>${esc(sc.basra_impact)}</p>
        <p><b>对WQ1影响：</b>${esc(sc.wq1_impact)}</p>
        <p><b>企业准备：</b>${esc(sc.prep)}</p>
      </div>`).join("");
  }

  if (t === "advices") {
    const cls = {"立即执行":"adv-immediate","提前准备":"adv-prepare","持续监测":"adv-monitor","暂不调整":"adv-hold"};
    const items = b.items || b.advices || [];
    return `<ul style="padding-left:1.2em;">` +
      items.map(a => {
        const type = a.level || a.type || "持续监测";
        const action = a.text || a.action || "";
        return `<li style="margin:6px 0;"><span class="adv-tag ${cls[type] || 'adv-monitor'}">${esc(type)}</span> ${esc(action)}</li>`;
      }).join("") + `</ul>`;
  }

  if (t === "citation") {
    return `<div class="an-fact" style="font-size:.88rem;margin:4px 0;">
      <a class="cite-ref" name="ref${b.ref}">[${b.ref}]</a>
      <b>${esc(b.risk_name || "")}</b> ${esc(b.title || "")}
      <span style="color:#888;">（${esc(b.country||"")} ${esc(b.city||"")}</span>）
      ${b.summary ? '<br>' + esc(b.summary) : ''}
    </div>`;
  }

  if (t === "wq1") {
    a = b.analysis || {};
    return `<div class="an-p">
      <p><b>结论：${esc(a.result || "")}</b></p>
      <p>${esc(a.detail || "")}</p>
      <table class="chg-table" style="margin-top:8px;">
        <tr><th>关联方向</th><th>当前状态</th></tr>
        ${(a.items || []).map(i => `<tr><td>${esc(i.area)}</td><td>${esc(i.status)}</td></tr>`).join("")}
      </table>
    </div>`;
  }

  if (t === "source_group") {
    const rows = b.rows || [];
    const norm = r => Array.isArray(r) ? {ref:r[0],org:r[1],title:r[2],time:r[3],url:r[4]} : (r || {});
    return `<div class="source-group"><h4>${esc(b.category)}（${rows.length}条）</h4>
      <table class="src-table"><tr><th>序号</th><th>机构</th><th>标题</th><th>时间</th><th>链接</th></tr>
      ${rows.map(r => { const x = norm(r); return `<tr><td>[${esc(x.ref)}]</td><td>${esc(x.org)}</td><td>${esc((x.title||'').slice(0,60))}</td><td>${esc((x.time||'').slice(0,16))}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">原文</a>`:'-'}</td></tr>`; }).join("")}
      </table></div>`;
  }

  return "";
}

function setupDetailToggles() {
  $all(".detail-toggle").forEach(el => {
    el.onclick = function() {
      const target = document.getElementById(this.dataset.target);
      if (target) target.classList.toggle("open");
      this.textContent = target && target.classList.contains("open") ? "收起 ▲" : "查看更多 ▼";
    };
  });
}

function copyReport() {
  if (!_md || _md.length < 50) return toast("暂无可复制内容");
  navigator.clipboard.writeText(_md).then(() => toast("日报全文已复制到剪贴板")).catch(() => toast("复制失败，请手动选择"));
}
</script>
