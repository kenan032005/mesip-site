<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  // 构建元数据（控制台/调试用）：build_timestamp / git_commit / public_report_count / schema_version
  try {
    var _bm = (DB && DB.build_meta) || null;
    if (_bm) {
      window.__MESIP_BUILD__ = _bm;
      console.info("[MESIP 静态构建] " + (_bm.build_timestamp || "") + " | commit=" + (_bm.git_commit || "") +
        " | 专业报告(published)=" + (_bm.public_report_count) + " | schema=" + (_bm.schema_version || ""));
    }
  } catch (e) {}

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    // 详情优先从 proDetail（含全文翻译字段）查询，回退到列表精简版
    var arr = (DB && DB.proDetail) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    arr = (DB && DB.proReports) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String(arr[j].id) === String(id)) return arr[j];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/home") return DB.home;
    if (path === "/api/hormuz") return { report: DB.hormuz };
    if (path === "/api/brent") return DB.brent;
    if (path.indexOf("/api/reuters") === 0) return DB.reuters || { items: [], count: 0 };
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      // 默认仅返回 published（与 server.py _pro_public_filters 一致），export=all 解除限制
      var xpt = p.get("export");
      if (xpt !== "all") { arr = arr.filter(function (x) { return x.status === "published"; }); }
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var dom = p.get("domain");
      if (dom) arr = arr.filter(function (x) { return (x.content_categories || "").indexOf(dom) >= 0; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var rg = p.get("region");
      if (rg) arr = arr.filter(function (x) { return (x.regions || x.countries || "").indexOf(rg) >= 0; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      // 分页（与 server.py api_pro_reports 一致）
      var total = arr.length;
      var pg = parseInt(p.get("page") || "1", 10); if (!pg || pg < 1) pg = 1;
      var psz = parseInt(p.get("page_size") || "0", 10); if (!psz || psz < 0) psz = 0;
      if (psz > 100) psz = 100;
      var out = arr;
      if (psz > 0) out = arr.slice((pg - 1) * psz, pg * psz);
      return { reports: out, count: out.length, total: total, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-institutions") === 0) {
      return DB.proInstitutions || { institutions: [], count: 0 };
    }
    if (path.indexOf("/api/decision-brief") === 0) {
      // Stage 4（2026-08-05）：决策型日报静态路由
      var q = new URLSearchParams(path.split("?")[1] || "");
      var ddate = q.get("date") || "";
      var arr = DB.decisionBriefs || [];
      if (ddate) {
        var hit = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i].brief_date === ddate) { hit = arr[i]; break; } }
        return { brief: hit };
      }
      return { brief: arr.length ? arr[0] : null };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("pro_analysis.html");

var WQ1_LABELS = {direct:"高",A:"高",potential:"中",B:"中",indirect:"低",C:"低",none:"暂无明显影响",D:"暂无明显影响"};

// 内容类型标签（2026-08-04 Stage 0 + Stage 3A：如实区分，不得一律标为“全文翻译”）
// Stage 3A 起优先使用 content_mode（full_translation/detailed_report_summary/...），
// 旧记录回退到 translation_completeness/translation_scope/report_class 推断。
var PRO_MODE_LABELS = {
  full_report_translation: "报告全文翻译",
  full_public_page_translation: "官方分析全文翻译",
  selected_chapters_translation: "章节摘译",
  executive_summary_digest: "执行摘要译介",
  selected_sections_digest: "选定章节概括",
  detailed_report_summary: "报告深度摘要",
  public_content_digest: "公开内容整理",
  expert_commentary_digest: "专家评论整理"
};
function proContentTypeLabel(r) {
  var cm = (r.content_mode || "");
  if (cm === "full_public_page_translation" && (r.document_class === "expert_commentary" || (r.report_class || "") === "expert_commentary")) {
    return "专家评论全文翻译";
  }
  if (PRO_MODE_LABELS[cm]) return PRO_MODE_LABELS[cm];
  var tc = (r.translation_completeness || "");
  var scope = (r.translation_scope || "");
  var cls = (r.report_class || "") || (r.document_class || "");
  if (cls === "expert_commentary") return "专家评论";
  if (tc === "complete" || scope === "full" || scope === "full_report") return "报告全文翻译";
  if (scope === "selected_chapters" || scope === "section") return "章节摘译";
  if (scope === "executive_summary_only") return "执行摘要译介";
  if (scope === "public_content_digest" || scope === "detailed_summary" || scope === "deep_summary") return "公开内容整理/深度摘要";
  if (tc === "partial" || r.translated_blocks || r.content_blocks || r.structured_summary_blocks) return "结构化中文译介";
  if (tc === "summary_only" || r.core_conclusion) return "深度摘要";
  return "报告";
}

// 内容区标题（与 proContentTypeLabel 同口径）
function proContentSectionTitle(r) {
  var cm = (r.content_mode || "");
  if (PRO_MODE_LABELS[cm]) return PRO_MODE_LABELS[cm];
  var tc = (r.translation_completeness || "");
  var scope = (r.translation_scope || "");
  var cls = (r.report_class || "") || (r.document_class || "");
  if (cls === "expert_commentary") return "专家评论";
  if (tc === "complete" || scope === "full" || scope === "full_report") return "报告全文翻译";
  if (scope === "selected_chapters" || scope === "section") return "章节摘译";
  if (scope === "executive_summary_only") return "执行摘要译介";
  if (scope === "public_content_digest" || scope === "detailed_summary" || scope === "deep_summary") return "公开内容整理";
  if (tc === "partial" || r.translated_blocks || r.content_blocks || r.structured_summary_blocks) return "报告详细译介（含逐段翻译）";
  if (tc === "summary_only" || r.core_conclusion) return "报告深度摘要";
  return "报告内容";
}

function renderTranslatedBlocks(blocks) {
  // translated_blocks 格式：{source_block_id, type, translated_text, headers?, rows?, items?}
  if (!blocks || !Array.isArray(blocks)) return "";
  var html = "";
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var t = b.translated_text != null ? b.translated_text : "";
    switch (b.type) {
      case "heading_1":
        html += '<h2 style="margin:22px 0 10px;font-size:22px;font-weight:700;">' + esc(t) + '</h2>';
        break;
      case "heading_2":
        html += '<h3 style="margin:18px 0 8px;font-size:17px;font-weight:600;">' + esc(t) + '</h3>';
        break;
      case "heading_3":
        html += '<h4 style="margin:14px 0 6px;font-size:15px;font-weight:600;">' + esc(t) + '</h4>';
        break;
      case "section_heading":
        html += '<h3 style="margin:18px 0 8px;font-weight:600;">' + esc(t) + '</h3>';
        break;
      case "paragraph":
        html += '<p style="line-height:1.8;margin:0 0 12px;">' + esc(t) + '</p>';
        break;
      case "bullet_list":
        html += '<ul style="line-height:1.8;margin:0 0 12px;padding-left:20px;">';
        for (var j = 0; j < (b.items||[]).length; j++) html += '<li>' + esc(b.items[j]) + '</li>';
        html += '</ul>';
        break;
      case "numbered_list":
        html += '<ol style="line-height:1.8;margin:0 0 12px;padding-left:20px;">';
        for (var j = 0; j < (b.items||[]).length; j++) html += '<li>' + esc(b.items[j]) + '</li>';
        html += '</ol>';
        break;
      case "table":
        html += '<table class="tbl" style="margin:0 0 12px;border-collapse:collapse;"><thead>';
        if (b.headers) {
          html += '<tr>';
          for (var j = 0; j < b.headers.length; j++) html += '<th style="border:1px solid #ddd;padding:6px 10px;background:#f1f5f9;">' + esc(b.headers[j]) + '</th>';
          html += '</tr>';
        }
        html += '</thead><tbody>';
        if (b.rows) for (var j = 0; j < b.rows.length; j++) {
          html += '<tr>';
          var row = b.rows[j] || [];
          for (var k = 0; k < row.length; k++) html += '<td style="border:1px solid #ddd;padding:6px 10px;">' + esc(row[k]) + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        break;
      case "quote":
        html += '<blockquote style="border-left:3px solid var(--brand-2);margin:0 0 12px;padding:6px 12px;color:#555;">' + esc(t) + '</blockquote>';
        break;
      case "note":
        html += '<p class="small muted" style="margin:0 0 12px;">' + esc(t) + '</p>';
        break;
      case "figure_caption":
        html += '<p class="small muted" style="margin:0 0 12px;font-style:italic;">' + esc(t) + '</p>';
        break;
      default:
        if (t) html += '<p style="line-height:1.8;margin:0 0 12px;">' + esc(t) + '</p>';
    }
  }
  return html;
}
function renderContentBlocks(blocks) {
  if (!blocks || !Array.isArray(blocks)) return "";
  var html = "";
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    switch (b.type) {
      case "section_heading":
        html += '<h3 style="margin:18px 0 8px;font-weight:600;">' + esc(b.text) + '</h3>';
        break;
      case "paragraph":
        html += '<p style="line-height:1.8;margin:0 0 12px;">' + esc(b.text) + '</p>';
        break;
      case "bullet_list":
        html += '<ul style="line-height:1.8;margin:0 0 12px;padding-left:20px;">';
        for (var j = 0; j < (b.items||[]).length; j++) html += '<li>' + esc(b.items[j]) + '</li>';
        html += '</ul>';
        break;
      case "numbered_list":
        html += '<ol style="line-height:1.8;margin:0 0 12px;padding-left:20px;">';
        for (var j = 0; j < (b.items||[]).length; j++) html += '<li>' + esc(b.items[j]) + '</li>';
        html += '</ol>';
        break;
      case "table":
        html += '<table class="tbl" style="margin:0 0 12px;"><tbody>';
        if (b.rows) for (var j = 0; j < b.rows.length; j++) {
          html += '<tr>';
          var row = b.rows[j] || [];
          for (var k = 0; k < row.length; k++) html += '<td>' + esc(row[k]) + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        break;
      case "quote":
        html += '<blockquote style="border-left:3px solid var(--brand-2);margin:0 0 12px;padding:6px 12px;color:#555;">' + esc(b.text) + '</blockquote>';
        break;
      case "note":
        html += '<p class="small muted" style="margin:0 0 12px;">' + esc(b.text) + '</p>';
        break;
      default:
        if (b.text) html += '<p style="line-height:1.8;margin:0 0 12px;">' + esc(b.text) + '</p>';
    }
  }
  return html;
}

API.get("/api/pro-reports/" + encodeURIComponent(getQS("id") || "")).then(d => {
  var r = d.report;
  if (!r) { $("#report").innerHTML = '<div class="empty">未找到该专业报告。</div>'; return; }

  var region = r.related_regions || r.countries || r.regions || "";
  var wq1lv = (r.wq1_relevance || "");

  var html = '';
  // ===== 第一部分：标题 =====
  html += '<div class="hero" style="margin-bottom:18px;">';
  html += '<h1 style="margin:0 0 8px;font-size:28px;">' + esc(r.title_zh || r.title_orig || "") + '</h1>';
  html += '<div class="meta" style="gap:10px;flex-wrap:wrap;">';
  html += '<b>' + esc(r.org || "未知机构") + '</b>';
  html += '<span class="muted">' + esc(fmtTimeBJ(r.pub_date || r.zh_pub_date)) + '</span>';
  if (region) html += '<span class="muted">' + esc(region) + '</span>';
  var wq1t = WQ1_LABELS[wq1lv] || "—";
  html += '<span class="tag" style="background:#e651001a;color:#e65100;border:1px solid #e6510033">WQ1：' + esc(wq1t) + '</span>';
  // 内容类型标签（2026-08-04 Stage 0：如实区分内容类型，不得一律标为全文翻译）
  var typeLabel = proContentTypeLabel(r);
  if (typeLabel) html += '<span class="tag" style="background:#2563eb1a;color:#2563eb;border:1px solid #2563eb33">' + esc(typeLabel) + '</span>';
  html += '</div></div>';

  // ===== 内容范围说明（2026-08-04 Stage 3B：如实展示覆盖范围）=====
  if (r.content_scope_note || r.summary_basis || r.source_coverage_type) {
    var covLabel = {full_document:"全文", major_sections:"主要章节", executive_summary_only:"执行摘要",
                    selected_sections:"选定章节", public_page_only:"公开页面"}[r.source_coverage_type] || "";
    html += '<div class="report-sec" style="margin-bottom:18px;border-left:3px solid #94a3b8;padding-left:12px;">';
    html += '<h2 style="font-size:15px;margin:0 0 6px;">内容范围说明</h2>';
    if (covLabel) html += '<p class="small" style="margin:0 0 4px;"><b>覆盖范围：</b>' + esc(covLabel) + '</p>';
    if (r.source_page_count) html += '<p class="small" style="margin:0 0 4px;"><b>原文规模：</b>' + esc(String(r.source_page_count)) + ' 页' +
      (r.used_page_count ? '（本页内容基于其中 ' + esc(String(r.used_page_count)) + ' 页整理）' : '') + '</p>';
    if (r.content_scope_note) html += '<p class="small" style="margin:0 0 4px;">' + esc(r.content_scope_note) + '</p>';
    if (r.summary_basis) html += '<p class="small" style="margin:0;">' + esc(r.summary_basis) + '</p>';
    html += '</div>';
  }

  // ===== 第二部分：报告内容 =====
  var tc = (r.translation_completeness || "");
  var secTitle = "报告内容";
  if (tc === "complete") secTitle = "报告全文翻译";
  else if (tc === "partial" || r.content_blocks || r.translated_blocks) secTitle = "报告详细译介（含逐段翻译）";
  html += '<div class="report-sec"><h2>' + esc(secTitle) + '</h2>';
  var body = "";
  if (r.translated_blocks) {
    try { body = renderTranslatedBlocks(typeof r.translated_blocks === "string" ? JSON.parse(r.translated_blocks) : r.translated_blocks); }
    catch(e) { body = '<p>' + esc(r.content_zh || "") + '</p>'; }
  } else if (r.content_blocks) {
    try { body = renderContentBlocks(typeof r.content_blocks === "string" ? JSON.parse(r.content_blocks) : r.content_blocks); }
    catch(e) { body = '<p>' + esc(r.content_zh || "") + '</p>'; }
  } else if (r.structured_summary_blocks) {
    // 深度摘要/结构化概括（2026-08-04 新增支持：不得显示“暂无可展示的报告内容”）
    try { body = renderContentBlocks(typeof r.structured_summary_blocks === "string" ? JSON.parse(r.structured_summary_blocks) : r.structured_summary_blocks); }
    catch(e) { body = '<p>' + esc(r.content_zh || "") + '</p>'; }
  } else if (r.content_zh) {
    body = '<div style="line-height:1.8;">' + esc(r.content_zh).replace(/\\n/g,"<br>") + '</div>';
  } else if (r.core_conclusion) {
    body = '<div style="line-height:1.8;">' + esc(r.core_conclusion).replace(/\n/g,"<br>") + '</div>';
  } else {
    body = '<p class="muted">（该报告当前仅收录元数据，暂无可展示的中文内容；可点击下方“查看原文”访问原始报告。）</p>';
  }
  html += body;
  if (secTitle === "报告全文翻译") {
    html += '<p class="small muted" style="margin-top:12px;">本文为对原报告全文的中文翻译。中文译文仅供信息参考，如与原文存在差异以原文为准。</p>';
  } else if (r.content_blocks || r.translated_blocks) {
    html += '<p class="small muted" style="margin-top:12px;">本文为基于原报告公开信息整理的结构化中文译介，含原文主要章节的逐段翻译，非完整逐字全文翻译。完整内容及版权归原发布机构所有。</p>';
  } else if (secTitle.indexOf("深度摘要") >= 0 || secTitle.indexOf("摘要译介") >= 0) {
    html += '<p class="small muted" style="margin-top:12px;">本文为平台基于原报告公开信息整理的中文摘要/深度概括，非全文翻译。完整内容及版权归原发布机构所有。</p>';
  }
  html += '</div>';

  // ===== 第三部分：原文链接 =====
  if (r.orig_link) {
    html += '<div class="report-sec"><h2>查看原文</h2>';
    html += '<p><a href="' + esc(r.orig_link) + '" target="_blank" rel="noopener" class="btn sm">' + esc(r.orig_link) + '</a></p>';
    if (r.license_status || r.license_name) {
      var licMap = {public_domain:"公有领域", open_license:"开放许可", explicit_permission:"已获授权",
                    public_summary_only:"仅允许公开摘要", restricted:"受限内容（仅摘要）",
                    unknown_requires_review:"许可待核", conflict_requires_review:"许可冲突待核", un_public:"联合国公开文件"};
      html += '<p class="small muted" style="margin-top:6px;">使用说明：' +
        esc(licMap[r.license_status] || r.license_status || "") +
        (r.license_name ? '（' + esc(r.license_name) + '）' : '') +
        '。本文内容按许可要求整理，版权归原发布机构所有。</p>';
    }
    html += '</div>';
  }

  // ===== 第四部分：平台分析 =====
  html += '<div class="report-sec"><h2>平台分析</h2>';
  if (r.platform_analysis) {
    html += '<div style="line-height:1.8;">' + esc(String(r.platform_analysis)) + '</div>';
  } else {
    html += '<p class="small muted">该报告暂未生成平台分析。以下为基于报告关键信息的基本判断：</p>';
    html += '<div style="line-height:1.8;">';
    if (r.impact_iraq) html += '<p style="margin:0 0 8px;"><b>对伊拉克影响：</b>' + esc(r.impact_iraq) + '</p>';
    if (r.impact_basra) html += '<p style="margin:0 0 8px;"><b>对巴士拉影响：</b>' + esc(r.impact_basra) + '</p>';
    if (r.impact_wq1) html += '<p style="margin:0 0 8px;"><b>对WQ1影响：</b>' + esc(r.impact_wq1) + '</p>';
    html += '</div>';
  }
  html += '<p class="small muted" style="margin-top:8px;">以上分析由平台基于公开信息独立作出，不代表原报告发布机构观点。</p>';
  html += '</div>';

  // 多机构对比入口
  if (d.related && d.related.length >= 2) {
    var theme = (r.risk_category || "").split("/")[0] || r.content_categories || "";
    if (theme) {
      html += '<div class="section"><h2>多机构观点对比</h2>';
      html += '<div class="panel">该主题已聚集多家机构报告，<a class="btn sm" href="pro_analysis.html" onclick="localStorage.setItem(\'cmpTheme\',\'' + esc(theme) + '\')">前往生成对比</a>';
      html += '<span class="small muted">（含本篇共 ' + (d.related.length + 1) + ' 篇）</span></div></div>';
    }
  }

  $("#report").innerHTML = html;
}).catch(function(e) { $("#report").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
