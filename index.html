<script>
window.__STATIC__ = true;
(function () {
  // 兜底：防止 api.js 异常导致全局 API 未定义时，下方 API.get = ... 抛出
  // ReferenceError 而整段脚本中断（会让页面空白且无任何提示）。
  var API = window.API || (window.API = {});
  // 捕获一次，避免每次请求都重复读取可能不存在的全局对象
  var DB = window.__DB__ || null;
  window.__MESIP_DB_OK__ = !!DB;

  // 构建元数据（控制台/调试用）：build_timestamp / git_commit / public_report_count / schema_version
  try {
    var _bm = (DB && DB.build_meta) || null;
    if (_bm) {
      window.__MESIP_BUILD__ = _bm;
      console.info("[MESIP 静态构建] " + (_bm.build_timestamp || "") + " | commit=" + (_bm.git_commit || "") +
        " | 专业报告(published)=" + (_bm.public_report_count) + " | schema=" + (_bm.schema_version || ""));
    }
  } catch (e) {}

  function all() { return (DB && DB.events) || []; }
  function byId(id) {
    var arr = all();
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    return null;
  }
  function byProId(id) {
    // 详情优先从 proDetail（含全文翻译字段）查询，回退到列表精简版
    var arr = (DB && DB.proDetail) || [];
    for (var i = 0; i < arr.length; i++) {
      if (String(arr[i].id) === String(id)) return arr[i];
    }
    arr = (DB && DB.proReports) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String(arr[j].id) === String(id)) return arr[j];
    }
    return null;
  }
  function proRelatedOf(r) {
    if (!r || !DB || !DB.proReports) return [];
    var theme = ((r.risk_category || "").split("/")[0] || r.content_categories || "");
    if (!theme) return [];
    return DB.proReports.filter(function (x) {
      return String(x.id) !== String(r.id) &&
        ((x.risk_category || "").indexOf(theme) >= 0 || (x.content_categories || "").indexOf(theme) >= 0);
    }).slice(0, 4);
  }
  function relatedOf(e) {
    if (!e) return [];
    return all().filter(function (x) {
      return x.country === e.country && String(x.id) !== String(e.id);
    }).slice(0, 5);
  }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (!DB) throw new Error("数据未能成功加载，请刷新页面或检查网络后重试");
    if (path === "/api/overview") return DB.overview;
    if (path === "/api/home") return DB.home;
    if (path === "/api/hormuz") return { report: DB.hormuz };
    if (path === "/api/brent") return DB.brent;
    if (path.indexOf("/api/reuters") === 0) return DB.reuters || { items: [], count: 0 };
    if (path === "/api/iraq") return DB.iraq;
    if (path === "/api/reports") return { reports: DB.reports };
    if (path === "/api/countries") return { countries: ((DB.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); var e = byId(id); return { event: e, related: relatedOf(e) }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return DB.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return DB.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/pro-reports") === 0) {
      // 详情页：/api/pro-reports/<id>[?...]
      if (path.indexOf("/api/pro-reports/") === 0) {
        var pid = path.split("/").pop().split("?")[0];
        var prr = byProId(pid);
        return { report: prr, related: proRelatedOf(prr) };
      }
      // 列表页：/api/pro-reports[?...]
      var qs = path.split("?")[1] || "";
      var p = new URLSearchParams(qs);
      var arr = (DB.proReports) || [];
      // 默认仅返回 published（与 server.py _pro_public_filters 一致），export=all 解除限制
      var xpt = p.get("export");
      if (xpt !== "all") { arr = arr.filter(function (x) { return x.status === "published"; }); }
      var org = p.get("org");
      if (org) arr = arr.filter(function (x) { return (x.org || "").indexOf(org) >= 0; });
      var cps = p.get("copyright_status");
      if (cps) arr = arr.filter(function (x) { return x.copyright_status === cps; });
      var dom = p.get("domain");
      if (dom) arr = arr.filter(function (x) { return (x.content_categories || "").indexOf(dom) >= 0; });
      var wq = p.get("wq1_relevance");
      if (wq) arr = arr.filter(function (x) { return x.wq1_relevance === wq; });
      var rg = p.get("region");
      if (rg) arr = arr.filter(function (x) { return (x.regions || x.countries || "").indexOf(rg) >= 0; });
      var q = p.get("q");
      if (q) {
        var s = q.toLowerCase();
        arr = arr.filter(function (x) {
          return [x.title_zh, x.title_orig, x.org, x.content_zh, x.core_conclusion].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; });
        });
      }
      var orgs = {}, cops = {};
      arr.forEach(function (x) { if (x.org) orgs[x.org] = 1; if (x.copyright_status) cops[x.copyright_status] = 1; });
      // 分页（与 server.py api_pro_reports 一致）
      var total = arr.length;
      var pg = parseInt(p.get("page") || "1", 10); if (!pg || pg < 1) pg = 1;
      var psz = parseInt(p.get("page_size") || "0", 10); if (!psz || psz < 0) psz = 0;
      if (psz > 100) psz = 100;
      var out = arr;
      if (psz > 0) out = arr.slice((pg - 1) * psz, pg * psz);
      return { reports: out, count: out.length, total: total, orgs: Object.keys(orgs), copyright_statuses: Object.keys(cops) };
    }
    if (path.indexOf("/api/pro-institutions") === 0) {
      return DB.proInstitutions || { institutions: [], count: 0 };
    }
    if (path.indexOf("/api/decision-brief") === 0) {
      // Stage 4（2026-08-05）：决策型日报静态路由
      var q = new URLSearchParams(path.split("?")[1] || "");
      var ddate = q.get("date") || "";
      var arr = DB.decisionBriefs || [];
      if (ddate) {
        var hit = null;
        for (var i = 0; i < arr.length; i++) { if (arr[i].brief_date === ddate) { hit = arr[i]; break; } }
        return { brief: hit };
      }
      return { brief: arr.length ? arr[0] : null };
    }
    if (path.indexOf("/api/pro-compare") === 0) {
      return { comparable: false, count: 0, reports: [], message: "静态归档版暂不支持多机构对比，请访问原站或联系管理员。" };
    }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  // 关键修复：用 Promise 包裹，任何同步异常都转为 rejected，从而被页面 .catch 捕获，
  // 避免原来“data.js 未加载时同步抛错、页面空白且无提示”的问题。
  API.get = function (path) {
    return new Promise(function (resolve, reject) {
      try {
        var r = match(path);
        if (r && r.error) reject(new Error("静态数据缺失：" + (r.error || path)));
        else resolve(r);
      } catch (e) { reject(e); }
    });
  };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };

  // 若数据整体缺失，显示顶部提示条（各页面 .catch 还会显示具体错误）
  if (!DB) {
    document.addEventListener("DOMContentLoaded", function () {
      var b = document.getElementById("dbError");
      if (b) b.style.display = "block";
    });
  }
})();
</script>
<script>
renderHeader("index.html");

function hpEsc(s) {
  s = (s == null) ? "" : String(s);
  return s.replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function hpRiskClass(l) { return "hp-r" + (l || 1); }
function hpLink(u) { return u ? encodeURI(u) : "#"; }

/* 单条事件（伊拉克/巴士拉分类用） */
function evItem(e) {
  if (!e) return "";
  var href = e.id ? ("event.html?id=" + encodeURI(e.id)) : "#";
  return '<a class="hp-ev" href="' + hpLink(href) + '">'
    + '<span class="hp-ev-risk ' + hpRiskClass(e.risk_level) + '">' + hpEsc(e.risk_name || "") + '</span>'
    + '<div class="hp-ev-body">'
    + '<div class="hp-ev-title">' + hpEsc(e.title || "") + '</div>'
    + '<div class="hp-ev-meta">' + hpEsc(e.time_bj || "") + (e.location ? (" · " + hpEsc(e.location)) : "") + '</div>'
    + (e.summary1 ? '<div class="hp-ev-sum">' + hpEsc(e.summary1) + '</div>' : "")
    + '</div></a>';
}

/* 指标卡 */
function metricCard(m) {
  return '<a class="hp-metric" href="' + hpLink(m.link) + '">'
    + '<div class="hp-metric-val">' + hpEsc(m.value) + '</div>'
    + '<div class="hp-metric-label">' + hpEsc(m.label) + '</div></a>';
}

/* WQ1 影响卡 */
function wq1Card(it) {
  var map = { "正常": "ok", "需关注": "watch", "受影响": "affected", "严重受影响": "severe" };
  var cls = map[it.status] || "";
  // 末行优先展示 hy3 生成的过去24h AI 分析（≤100字）；无分析时回退原静态文字
  var ai = it.analysis;
  var bottom = ai
    ? '<div class="hp-wq1-analysis"><span class="hp-ai-badge">AI研判</span>' + hpEsc(ai) + '</div>'
    : '<div class="hp-wq1-detail">' + hpEsc(it.detail) + '</div>';
  return '<div class="hp-wq1-card ' + cls + '">'
    + '<div class="hp-wq1-label">' + hpEsc(it.label) + '</div>'
    + '<div class="hp-wq1-status">' + hpEsc(it.status) + '</div>'
    + bottom + '</div>';
}

/* 预警卡 */
function alertCard(a) {
  // Stage 2 预警卡：判断型标题 + WQ1核心影响 + 影响领域 + 时间窗口 + 行动建议 + 可信度
  if (a.alert_title) {
    var lv = a.alert_level === "critical" ? "严重" : "高";
    var lvcls = a.alert_level === "critical" ? "hp-alert-lv-critical" : "hp-alert-lv-high";
    var acts = (a.recommended_actions || []).slice(0, 3).map(function (x) { return "· " + x; }).join("<br>");
    var dims = (a.affected_dimensions || []).slice(0, 4).join("、") || "—";
    var prov = a.is_provisional ? ' <span class="hp-verify-tag">信息仍在核实中</span>' : "";
    return '<a class="hp-alert" href="' + hpLink(a.url) + '">'
      + '<div class="hp-alert-head">'
      + '<span class="hp-alert-lv ' + lvcls + '">' + lv + '</span>'
      + '<span class="hp-cred">可信度：' + hpEsc(a.confidence_level || "medium") + (a.verification_status ? (" · " + hpEsc(a.verification_status)) : "") + prov + '</span>'
      + '<span class="hp-alert-time">' + hpEsc(a.impact_window || "") + '</span></div>'
      + '<div class="hp-alert-title">' + hpEsc(a.alert_title) + '</div>'
      + '<div class="hp-alert-conf"><b>WQ1核心影响：</b>' + hpEsc(a.wq1_judgment || "") + '</div>'
      + '<div class="hp-alert-rows">'
      + '<div><b>影响领域：</b>' + hpEsc(dims) + '</div>'
      + '<div><b>传导路径：</b>' + hpEsc(a.transmission_path || "—") + '</div>'
      + '<div><b>建议行动：</b><br>' + acts + '</div>'
      + '<div class="hp-muted-sm"><b>监测指标：</b>' + hpEsc((a.monitoring_indicators || []).slice(0, 3).join("；") || "—") + '</div>'
      + '</div></a>';
  }
  // 旧结构兜底
  return '<a class="hp-alert" href="' + hpLink(a.url) + '">'
    + '<div class="hp-alert-head">'
    + '<span class="hp-ev-risk ' + hpRiskClass(a.risk_level) + '">' + hpEsc(a.risk_name) + '</span>'
    + '<span class="hp-cred">' + hpEsc(a.credibility_name || "") + (a.verify_label ? (" · " + hpEsc(a.verify_label)) : "") + '</span>'
    + '<span class="hp-alert-time">' + hpEsc(a.time_bj || "") + '</span></div>'
    + '<div class="hp-alert-title">' + hpEsc(a.title) + '</div>'
    + '<div class="hp-alert-conf">' + hpEsc(a.confirmed) + '</div>'
    + '<div class="hp-alert-rows">'
    + '<div><b>WQ1影响：</b>' + hpEsc(a.wq1_impact) + '</div>'
    + '<div><b>人员影响：</b>' + hpEsc(a.personnel_impact) + '</div>'
    + '<div><b>处置建议：</b>' + hpEsc(a.advice) + '</div>'
    + '</div></a>';
}

/* 地区风险卡 */
function regionCard(r) {
  var tcls = r.trend === "up" ? "up" : (r.trend === "down" ? "down" : "flat");
  var d = (r.delta_1d != null && r.delta_1d !== 0) ? (" (" + (r.delta_1d > 0 ? "+" : "") + r.delta_1d + ")") : "";
  return '<a class="hp-rcard" href="' + hpLink(r.url) + '">'
    + '<div class="hp-rcard-top">'
    + '<span class="hp-ev-risk ' + hpRiskClass(r.level) + '">' + hpEsc(r.risk_name) + '</span>'
    + '<span class="hp-trend ' + tcls + '">' + hpEsc(r.trend_name) + d + '</span></div>'
    + '<div class="hp-rcard-name">' + hpEsc(r.country) + '</div>'
    + '<div class="hp-rcard-main">主要风险：' + hpEsc(r.main_risk || "—") + '</div>'
    + '<div class="hp-rcard-link">对伊拉克关联：' + hpEsc(r.iraq_link) + '</div>'
    + (r.llm_note ? '<div class="hp-rcard-note">' + hpEsc(r.llm_note) + '</div>' : "")
    + '</a>';
}

/* 伊拉克/巴士拉分类桶（analysisMap：各子模块 hy3 生成的过去24h AI 分析 ≤200字） */
function iraqBuckets(map, analysisMap) {
  var html = "";
  for (var name in map) {
    if (!map.hasOwnProperty(name)) continue;
    var arr = map[name] || [];
    var ai = analysisMap ? (analysisMap[name] || "") : "";
    html += '<div class="hp-bucket"><div class="hp-bucket-h">' + hpEsc(name) + '</div>';
    if (ai) {
      html += '<div class="hp-bucket-analysis"><span class="hp-ai-badge">AI研判</span>' + hpEsc(ai) + '</div>';

    } else {

    html += '</div>';

}

/* 霍尔木兹海峡通航情况 模块 */
var HORMUZ_LVL = {
  "通航正常": "ok", "基本正常": "basic", "通航受限": "limited",
  "通航严重受限": "severe", "实际中断": "blocked", "信息不足，暂无法判断": "unknown"
};
function fmtBJCN(s) {
  if (!s) return "";
  var m = String(s).match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);
  if (m) return m[1] + "年" + parseInt(m[2], 10) + "月" + parseInt(m[3], 10) + "日" + m[4] + ":" + m[5];
  return String(s);
}
function hzShort(sh, full, maxLen) {
  /* 优先使用 hy3 生成的 *_short 字段；旧数据无该字段时按长度截断 full 回退 */
  if (sh) return String(sh);
  var s = String(full || "");
  maxLen = maxLen || 64;
  return s.length > maxLen ? s.slice(0, maxLen) + "…" : s;
}
function hzSrcLinks(srcs) {
  return (srcs || []).map(function (s) {
    return '<a href="' + hpLink(s.url || "#") + '" target="_blank" rel="noopener">' + hpEsc(s.name || s.url || "来源") + '</a>';
  }).join("、");
}
function hzStatusCls(txt) {
  var s = String(txt || "");
  if (/中断|关闭|禁行|停航|停运/.test(s)) return "st-bad";
  if (/受限|暂停|收紧|上调|升高|拒航|扣押|遇袭|附加/.test(s)) return "st-warn";
  if (/正常|恢复|平稳|维持/.test(s)) return "st-ok";
  return "st-neutral";
}
function hormuzRow(it, idx) {
  var srcHtml = hzSrcLinks(it.sources);
  var progShort = hzShort(it.latest_progress_short, it.latest_progress, 64);
  var impShort = hzShort(it.iraq_basra_impact_short, it.iraq_basra_impact, 56);

    + '<td class="hz-progress" data-label="最新情况"><div class="hz-cell-short">' + hpEsc(progShort) + '</div>' + metaLine + '</td>'

    + (it.effective_time ? '<div class="hz-d-block"><b>生效或发生时间</b><p>' + hpEsc(it.effective_time) + '</p></div>' : '')
    + '<div class="hz-d-block"><b>对伊拉克及巴士拉的影响（完整）</b><p>' + hpEsc(it.iraq_basra_impact || "") + '</p></div>'

}
var HORMUZ_SUMMARY_DEF = [
  { key: "overall", label: "整体通航", kw: null },
  { key: "iraq_export", label: "伊拉克及巴士拉出口", kw: /伊拉克|巴士拉|装运|原油/ },
  { key: "ship_safety", label: "船舶安全", kw: /遇袭|扣押|安全/ },
  { key: "insurance", label: "保险与船东", kw: /船东|战争险|保险/ }
];
function buildHormuzSummary(d) {
  var summ = d.summary && typeof d.summary === "object" ? d.summary : null;
  var items = d.items || [];
  return HORMUZ_SUMMARY_DEF.map(function (def) {
    var label = "", lvlCls = "st-neutral";
    if (summ && summ[def.key] && summ[def.key].label) {
      label = summ[def.key].label;
      lvlCls = summ[def.key].level ? "st-" + summ[def.key].level : hzStatusCls(label);
    } else if (!def.kw) {
      label = d.overall_status_level || "—";
      lvlCls = hzStatusCls(label);
    } else {
      for (var i = 0; i < items.length; i++) {
        if (def.kw.test(items[i].item_name || "")) { label = items[i].current_status || ""; break; }
      }
      if (!label) label = "—";
      lvlCls = hzStatusCls(label);
    }
    /* 摘要条为紧凑状态条：旧数据回退的长句截断展示，完整内容见表格与详情页 */
    if (label.length > 18) label = label.slice(0, 18) + "…";
    return '<div class="hz-sum-cell"><div class="hz-sum-name">' + hpEsc(def.label) + '</div>'
      + '<div class="hz-sum-val ' + lvlCls + '">' + hpEsc(label) + '</div></div>';
  }).join("");
}
function bindHormuzToggles() {
  var btns = document.querySelectorAll(".hz-toggle");
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      var idx = this.getAttribute("data-hz");
      var det = document.getElementById("hzd-" + idx);
      var isOpen = det && !det.hidden;
      /* 默认一次展开一行：先收起所有 */
      var all = document.querySelectorAll(".hz-detail");
      for (var j = 0; j < all.length; j++) all[j].hidden = true;
      var allBtns = document.querySelectorAll(".hz-toggle");
      for (var k = 0; k < allBtns.length; k++) {
        allBtns[k].textContent = "展开详情";
        allBtns[k].setAttribute("aria-expanded", "false");
      }
      if (det && !isOpen) {
        det.hidden = false;
        this.textContent = "收起详情";
        this.setAttribute("aria-expanded", "true");
      }
    };
  }
}

var BRENT_STATUS_TXT = {
  "open": "交易中", "closed": "已收盘", "holiday": "休市",
  "delayed": "延迟行情", "failed": "暂不可用", "abnormal": "数据异常"
};
function fmtBJfromISO(s) {
  if (!s) return "";
  var m = String(s).match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);
  if (m) return m[1] + "年" + parseInt(m[2], 10) + "月" + parseInt(m[3], 10) + "日" + m[4] + ":" + m[5];
  return String(s);
}
function renderBrent(d) {

  // 状态标签（文字 + 颜色，绝不仅用颜色）

/* 轻量 SVG 折线图（无第三方库）：真实行情、悬停显示日期+价格、移动端可触摸、网站主蓝风格 */
function renderBrentChart(container, history) {
  container.innerHTML = "";
  if (!history || !history.length) return;
  var data = history.slice(-30).map(function (p) { return { d: p.date, v: Number(p.close) }; });
  var W = 320, H = 135, PAD_L = 8, PAD_R = 8, PAD_T = 10, PAD_B = 22;
  var minV = Math.min.apply(null, data.map(function (x) { return x.v; }));
  var maxV = Math.max.apply(null, data.map(function (x) { return x.v; }));
  if (maxV - minV < 0.01) { maxV += 1; minV -= 1; }
  var pad = (maxV - minV) * 0.12;
  minV -= pad; maxV += pad;
  function X(i) { return PAD_L + (W - PAD_L - PAD_R) * (i / (data.length - 1 || 1)); }
  function Y(v) { return PAD_T + (H - PAD_T - PAD_B) * (1 - (v - minV) / (maxV - minV)); }

  // 三条水平网格线（虚线）+ 上下两个价格标签
  var gridLines = "";
  var yLabels = "";
  function fmtTick(v) {
    var n = Number(v).toFixed(2);
    return n.replace(/\.?0+$/, "");
  }
  for (var g = 0; g < 3; g++) {
    var y = PAD_T + (H - PAD_T - PAD_B) * (g / 2);
    gridLines += '<line class="hp-chart-grid" x1="' + PAD_L + '" y1="' + y.toFixed(1) + '" x2="' + (W - PAD_R) + '" y2="' + y.toFixed(1) + '"/>';
  }
  yLabels = '<text class="hp-chart-y" x="' + (W - 2) + '" y="' + (PAD_T + 4) + '" text-anchor="end">' + fmtTick(maxV - pad) + '</text>' +
            '<text class="hp-chart-y" x="' + (W - 2) + '" y="' + (H - PAD_B - 1) + '" text-anchor="end">' + fmtTick(minV + pad) + '</text>';

  var pts = data.map(function (x, i) { return X(i).toFixed(1) + "," + Y(x.v).toFixed(1); }).join(" ");
  var area = "M" + X(0).toFixed(1) + "," + Y(data[0].v).toFixed(1) + " L" + pts.replace(/ /g, " L") +
            " L" + X(data.length - 1).toFixed(1) + "," + (H - PAD_B) + " L" + X(0).toFixed(1) + "," + (H - PAD_B) + " Z";

  // 横轴日期刻度（约 5 个，避免过密）
  var ticks = "";
  var step = Math.max(1, Math.floor(data.length / 5));
  for (var i = 0; i < data.length; i += step) {
    var lbl = data[i].d.slice(5); // MM-DD
    ticks += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" class="hp-chart-x" text-anchor="middle">' + lbl + '</text>';
  }
  // 终值点高亮（最新数据点 = 网站金色 #c9952b，半径 3px）
  var lx = X(data.length - 1).toFixed(1), ly = Y(data[data.length - 1].v).toFixed(1);

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="hp-chart-svg">' +
    '<defs><linearGradient id="brentFill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="rgb(20,80,126)" stop-opacity="0.12"/>' +
    '<stop offset="100%" stop-color="rgb(20,80,126)" stop-opacity="0.01"/></linearGradient></defs>' +
    gridLines +
    '<path d="' + area + '" fill="url(#brentFill)" stroke="none"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#14507e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + lx + '" cy="' + ly + '" r="3" fill="#c9952b" stroke="#fff" stroke-width="1.2"/>' +
    yLabels +
    ticks +
    '</svg>';

  // 悬停层
  var tip = document.createElement("div");
  tip.className = "hp-chart-tip";
  tip.style.display = "none";
  container.innerHTML = svg;
  container.appendChild(tip);

  function showAt(clientX) {
    var rect = container.getBoundingClientRect();
    var rel = (clientX - rect.left) / rect.width;       // 0..1
    var idx = Math.round(rel * (data.length - 1));
    idx = Math.max(0, Math.min(data.length - 1, idx));
    var p = data[idx];
    tip.style.display = "block";
    tip.innerHTML = '<b>' + p.d + '</b><br>' + Number(p.v).toFixed(2) + ' 美元/桶';
    var leftPct = (X(idx) / W) * 100;
    tip.style.left = Math.max(2, Math.min(94, leftPct)) + "%";
  }
  function hide() { tip.style.display = "none"; }

  container.addEventListener("mousemove", function (e) { showAt(e.clientX); });
  container.addEventListener("mouseleave", hide);
  container.addEventListener("touchstart", function (e) { if (e.touches[0]) showAt(e.touches[0].clientX); }, { passive: true });
  container.addEventListener("touchmove", function (e) { if (e.touches[0]) showAt(e.touches[0].clientX); }, { passive: true });
  container.addEventListener("touchend", hide);
}

  }
  API.get("/api/home").then(function (d) {
    if (!d || d.error) {
      document.getElementById("sitText").textContent = "数据暂不可用，请稍后重试";
      return;
    }
    renderHome(d);
    loadHormuz();
    loadBrent();
  }).catch(function (e) {
    var b = document.getElementById("dbError");
    if (b) b.style.display = "block";
    document.getElementById("sitText").textContent = "加载失败：" + (e && e.message ? e.message : e);
    console.error(e);
  });
}

loadHome();
</script>
</body>
</html>
