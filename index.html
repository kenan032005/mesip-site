<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中东地区社会安全信息平台 · 首页</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="container">

  <div class="hero" id="hero">
    <h1>中东地区社会安全信息平台</h1>
    <p id="summary">正在加载今日安全形势摘要……</p>
    <div class="updatebar" id="updateBar">
      <span>🗓️ 当前为静态归档版本（数据快照）</span>
      <span class="muted">最后更新：<b id="lastCollect">--</b></span>
      <span class="muted">下次更新：<b id="nextCollect">--</b></span>
      <button class="btn small" id="refreshBtn" type="button">📌 静态归档版</button>
    </div>
  </div>

  <div class="section">
    <h2>今日中东地区安全形势</h2>
    <div class="row" id="statRow"></div>
  </div>

  <div class="section">
    <h2>高 / 极高风险事件</h2>
    <div class="grid cards" id="highRisk"></div>
  </div>

  <div class="section">
    <h2>最新重要事件</h2>
    <div class="grid cards" id="latest"></div>
  </div>

  <div class="section">
    <h2>伊拉克安全动态（过去24小时）</h2>
    <div class="grid cards" id="iraqToday"></div>
  </div>

  <div class="section">
    <h2>涉及中国企业与公民的信息</h2>
    <div class="grid cards" id="china"></div>
  </div>

  <div class="section">
    <h2>重点国家当前风险等级</h2>
    <div class="matrix" id="matrix"></div>
  </div>

  <div class="section">
    <h2>《中东地区社会安全信息日报》</h2>
    <div class="panel" id="reportBox">
      <p class="muted">正在加载当日日报……</p>
    </div>
  </div>

</div>
<footer class="site"></footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/data.js"></script>
<script>
window.__STATIC__ = true;
(function () {
  function all() { return window.__DB__.events || []; }
  function filt(qs) {
    var p = new URLSearchParams(qs || "");
    var arr = all().slice();
    var c = p.get("country"); if (c) arr = arr.filter(function (e) { return e.country === c; });
    var r = p.get("risk"); if (r) arr = arr.filter(function (e) { return String(e.risk_level) === String(r); });
    var cat = p.get("category"); if (cat) arr = arr.filter(function (e) { return e.category === cat; });
    var f = p.get("from"); if (f) arr = arr.filter(function (e) { return (e.publish_time || "") >= f; });
    var t = p.get("to"); if (t) arr = arr.filter(function (e) { return (e.publish_time || "") <= t; });
    if (p.get("china") === "1") arr = arr.filter(function (e) { return e.involves_china_company || e.involves_china_citizen; });
    var q = p.get("q"); if (q) { var s = q.toLowerCase(); arr = arr.filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); }
    var lim = p.get("limit"); if (lim && parseInt(lim)) arr = arr.slice(0, parseInt(lim));
    return arr;
  }
  function match(path) {
    if (path === "/api/overview") return window.__DB__.overview;
    if (path === "/api/iraq") return window.__DB__.iraq;
    if (path === "/api/reports") return { reports: window.__DB__.reports };
    if (path === "/api/countries") return { countries: ((window.__DB__.overview || {}).countries || []) };
    if (path.indexOf("/api/event/") === 0) { var id = path.split("/").pop(); return window.__DB__.eventMap[id] || { event: null, related: [] }; }
    if (path.indexOf("/api/country/") === 0) { var n = decodeURIComponent(path.split("/").pop()); return window.__DB__.countryMap[n] || { country: null, events: [], risk_history: [] }; }
    if (path.indexOf("/api/report/") === 0) { var d = path.split("/").pop(); return window.__DB__.reportMap[d] || { report: null }; }
    if (path.indexOf("/api/events") === 0) { var fa = filt(path.split("?")[1] || ""); return { events: fa, count: fa.length }; }
    if (path.indexOf("/api/search") === 0) { var q = new URLSearchParams(path.split("?")[1] || "").get("q") || ""; var s = q.toLowerCase(); var fa = all().filter(function (e) { return [e.title_zh, e.title_original, e.summary, e.country, e.city, e.category].some(function (v) { return (v || "").toLowerCase().indexOf(s) >= 0; }); }); return { events: fa, count: fa.length }; }
    return { error: "static-unknown-path", path: path };
  }
  API.get = function (path) { return Promise.resolve(match(path)); };
  API.post = function () { return Promise.resolve({ ok: false, static: true, msg: "静态归档版不支持该操作" }); };
})();
</script>
<script>
renderHeader("index.html");
function loadHome() {
  API.get("/api/overview").then(d => {
    if (!d || d.error) {
      $("#summary").textContent = "数据暂不可用，请稍后重试";
      return;
    }
    $("#summary").textContent = d.summary;
    setUpdated(d.last_updated);
    $("#ciMin").textContent = d.collect_interval_minutes || 60;
    $("#lastCollect").textContent = fmtTime(d.last_collect) || "尚未采集";
    $("#nextCollect").textContent = fmtTime(d.next_collect) || "--";
    const c = d.counts;
    $("#statRow").innerHTML = [
      ["已发布信息", c.published, "var(--brand)"],
      ["待审核", c.pending, "var(--accent)"],
      ["24h高/极高风险", c.high_risk_24h, "var(--risk-3)"],
    ].map(([k,v,col]) => `<div class="panel" style="flex:1;min-width:150px;text-align:center;">
        <div style="font-size:26px;font-weight:700;color:${col}">${v}</div>
        <div class="muted small">${k}</div></div>`).join("");

  $("#highRisk").innerHTML = d.high_risk.length ? d.high_risk.map(e => eventCard(e)).join("")
    : `<div class="empty">当前无高/极高风险事件。</div>`;
  $("#latest").innerHTML = d.latest.map(e => eventCard(e)).join("");
  $("#iraqToday").innerHTML = d.iraq_today.length ? d.iraq_today.map(e => eventCard(e)).join("")
    : `<div class="empty">过去24小时伊拉克无新增重大动态。</div>`;
  $("#china").innerHTML = d.china.length ? d.china.map(e => eventCard(e)).join("")
    : `<div class="empty">过去24小时未发现涉及中国企业和中国公民的重大新增社会安全事件。</div>`;

  $("#matrix").innerHTML = d.countries.map(co => {
    const r = co.current_risk || 1;
    return `<a class="mcell" href="country.html?c=${encodeURIComponent(co.name_zh)}" style="text-decoration:none;color:inherit;">
      <div class="cn">${esc(co.name_zh)}</div>
      <div class="rv">${riskBadge(r)}</div></a>`;
  }).join("");

  if (d.today_report) {
    const r = d.today_report;
    const parts = r.sections || [];
    const keys = parts.find(s => s.id === "key");
    $("#reportBox").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div><b>《中东地区社会安全信息日报》</b> <span class="muted small">（${d.today_report_date}）</span>
        <div class="small muted">${esc(r.meta ? ("收录 " + (r.meta.counts ? r.meta.counts.total_24h : "") + " 条") : "")}</div></div>
        <a class="btn" href="report.html?d=${d.today_report_date}">查看完整日报</a></div>`;
  } else {
    $("#reportBox").innerHTML = `<p class="muted">今日日报尚未生成。可在后台手动生成。</p>`;
  }
  }).catch(e => {
    $("#summary").textContent = "加载失败：" + e.message;
    console.error(e);
  });
}

$("#refreshBtn").addEventListener("click", function () {
  toast("静态归档版不支持实时刷新，请访问原站或联系管理员");
});

loadHome();
</script>
</body>
</html>
